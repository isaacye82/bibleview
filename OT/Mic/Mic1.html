        :root {
            /* Theme: Judgment, Majesty, and Mourning */
            
            /* Deep Purple/Indigo - Divine Judgment & Royalty */
            --theme-primary: #4c1d95; 
            /* Dusty Earth - "Roll in the dust" */
            --theme-secondary: #78350f;
            /* Crimson - The Incurable Wound */
            --theme-accent: #9f1239;
            /* Background - Parchment/Stone */
            --theme-bg: #fafafa;
            /* Text Color */
            --theme-text: #262626;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--theme-bg);
            color: var(--theme-text);
        }

        .en-text {
            font-family: 'Playfair Display', serif;
        }

        h1, h2, h3, .serif {
            font-family: 'Noto Serif SC', serif;
        }

        /* Navigation Styling */
        .nav-btn {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .active-tab {
            color: var(--theme-primary);
            font-weight: 700;
        }
        .active-tab::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--theme-primary);
            border-radius: 2px;
        }

        /* Card Styling */
        .verse-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }
        .verse-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(76, 29, 149, 0.15);
            border-color: var(--theme-primary);
        }

        /* Meaning Boxes - Adjusted for new theme */
        .exegesis-box {
            background-color: #f5f3ff; /* Violet 50 */
            border-left: 3px solid #6d28d9; /* Violet 700 */
            color: #4c1d95;
        }
        
        .devotional-box {
            background-color: #fff1f2; /* Rose 50 */
            border-left: 3px solid #be123c; /* Rose 700 */
            color: #881337;
        }

        /* Animation Classes */
        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Melting Effect Animation (for "Mountains melt like wax") */
        .melt-anim {
            position: relative;
            overflow: hidden;
        }
        .melt-anim::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
            animation: waxMelt 6s infinite ease-in-out;
            transform: rotate(45deg);
        }
        @keyframes waxMelt {
            0% { transform: translateY(-100%) rotate(45deg); }
            100% { transform: translateY(100%) rotate(45deg); }
        }

        /* Tear/Drop Animation */
        .tear-anim {
            animation: tearDrop 3s infinite ease-in;
        }
        @keyframes tearDrop {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            90% { transform: translateY(40px) scale(0.8); opacity: 1; }
            100% { transform: translateY(45px) scale(0.5); opacity: 0; }
        }

                btn.classList.add('text-stone-500');
            });

                if (view === 'dashboard') renderDashboard();
                if (view === 'study') renderStudy();
                if (view === 'methodology') renderMethodology();
                container.style.opacity = '1';
                window.scrollTo(0,0);

                         <div class="relative w-full z-10 flex flex-col space-y-6 h-full justify-center">
                            
                            <!-- 1. The Holy Place -->
                            <div class="flex items-center space-x-4 group">
                                <div class="w-10 h-10 rounded-full bg-indigo-900 flex items-center justify-center text-indigo-300 shadow-lg border border-indigo-500 relative z-20">
                                    <i class="fas fa-church"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="text-xs text-indigo-200 font-bold uppercase tracking-wider mb-1">Heaven's Court</div>

                            <div class="absolute left-[19px] top-8 bottom-12 w-0.5 bg-gradient-to-b from-indigo-500 via-rose-500 to-stone-500 opacity-50"></div>

                                    <i class="fas fa-fire-alt text-lg"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="text-xs text-rose-300 font-bold uppercase tracking-wider mb-1">Creation Melts</div>

                                </div>
                            </div>

                            <!-- 3. Dust of Mourning -->
                            <div class="flex items-center space-x-4 group mt-2">
                                <div class="w-10 h-10 rounded-full bg-stone-800 flex items-center justify-center text-stone-400 shadow-lg border border-stone-600 z-20">
                                    <i class="fas fa-skull-crossbones"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="text-xs text-stone-300 font-bold uppercase tracking-wider mb-1">Gate of Jerusalem</div>

                </div>

                <!-- Highlight: The Prophet's Action -->
                <div class="bg-gradient-to-r from-stone-100 to-stone-200 p-6 rounded-2xl shadow-sm border border-stone-300 fade-in flex items-start sm:items-center">

                        <i class="fas fa-user-injured tear-anim"></i>
                    </div>

                            弥迦没有高高在上地宣告审判，而是赤身赤脚哀号，如同战俘。这提醒我们：真正的真理传递者，总是对罪的后果感到切肤之痛。
                        </p>
                    </div>
                </div>
            `;
        }

        function renderStudy() {
            const container = document.getElementById('app-content');
            
            // Header for Study View
            const headerHTML = `
                <div class="text-center mb-8 fade-in">
                    <h2 class="text-2xl font-bold text-indigo-900 serif">经文逐节研读</h2>
                    <p class="text-sm text-stone-500 en-text italic">Exegesis & Devotional Journey</p>
                    <div class="w-16 h-1 bg-indigo-800 mx-auto mt-4 rounded-full"></div>
                </div>
            `;

            let sectionsHTML = '';
            chapterData.sections.forEach((section, index) => {
                sectionsHTML += `
                    <div class="max-w-4xl mx-auto mb-16 fade-in" style="animation-delay: ${index * 0.1}s">
                        <!-- Section Header -->
                        <div class="flex items-baseline mb-6 border-b border-indigo-100 pb-2">
                            <span class="text-4xl text-indigo-200 font-bold mr-4 -mb-1 opacity-50">${index + 1}</span>
                            <div>
                                <h3 class="text-xl sm:text-2xl font-bold text-indigo-900">${section.title}</h3>
                                <p class="text-xs sm:text-sm text-stone-500 font-serif italic en-text">${section.title_en}</p>
                            </div>
                        </div>
                        
                        <!-- Cards Stack -->
                        <div class="space-y-8">
                            ${section.verses.map(verse => createVerseCard(verse)).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = headerHTML + sectionsHTML;
        }

        function createVerseCard(verse) {
            return `
                <div class="verse-card group">
                    <!-- Scripture Area -->
                    <div class="bg-white p-5 sm:p-6 border-b border-stone-100 relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 text-8xl text-stone-100 opacity-50 font-serif pointer-events-none">"</div>
                        <span class="inline-block px-2 py-1 bg-indigo-50 text-indigo-800 text-[10px] font-bold rounded mb-3 font-mono border border-indigo-100">${verse.ref}</span>
                        <p class="text-stone-800 font-serif text-lg leading-relaxed mb-3 relative z-10">
                            ${verse.text_zh}
                        </p>
                        <p class="text-stone-500 font-serif text-sm italic en-text pl-4 border-l-2 border-stone-300">
                            ${verse.text_en}
                        </p>
                    </div>

                    <!-- Interpretation Area (Waterfall Layout) -->
                    <div class="flex flex-col md:flex-row">
                        <!-- Exegesis Block (Violet) -->
                        <div class="flex-1 p-5 sm:p-6 exegesis-box md:border-l-0 md:border-t-[3px] md:border-t-violet-700 md:border-b-0 relative">
                            <div class="flex items-center mb-3 text-violet-800">
                                <i class="fas fa-scroll mr-2 text-sm"></i>
                                <h4 class="text-xs font-bold uppercase tracking-widest">经文含义 Meaning</h4>
                            </div>
                            <h5 class="font-bold text-violet-900 mb-2 text-sm sm:text-base">${verse.exegesis.title}</h5>
                            <p class="text-sm text-violet-800 leading-relaxed text-justify mb-2 opacity-90">${verse.exegesis.content_zh}</p>
                            <p class="text-xs text-violet-600 font-serif italic en-text mt-3 opacity-80">${verse.exegesis.content_en}</p>
                        </div>

                        <!-- Devotional Block (Rose/Red) -->
                        <div class="flex-1 p-5 sm:p-6 devotional-box md:border-l-0 md:border-t-[3px] md:border-t-rose-700 md:border-b-0 relative">
                            <div class="flex items-center mb-3 text-rose-800">
                                <i class="fas fa-heart-broken mr-2 text-sm"></i>
                                <h4 class="text-xs font-bold uppercase tracking-widest">属灵意义 Spiritual</h4>
                            </div>
                            <h5 class="font-bold text-rose-900 mb-2 text-sm sm:text-base">${verse.devotional.title}</h5>
                            <p class="text-sm text-rose-800 leading-relaxed text-justify mb-2 opacity-90">${verse.devotional.content_zh}</p>
                            <p class="text-xs text-rose-600 font-serif italic en-text mt-3 opacity-80">${verse.devotional.content_en}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMethodology() {
            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="max-w-4xl mx-auto fade-in">
                    <div class="text-center mb-10">
                        <h2 class="text-2xl sm:text-3xl font-bold mb-2 serif text-stone-800">解经原则总结</h2>
                        <p class="text-stone-500 en-text">Summary of Methodology</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Exegesis Card -->
                        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-md border-t-4 border-violet-700">
                            <div class="text-violet-700 text-3xl mb-4"><i class="fas fa-university"></i></div>
                            <h3 class="text-lg font-bold text-stone-800 mb-2">历史文法解经 (Contextual Exegesis)</h3>
                            <p class="text-xs text-stone-400 mb-6 uppercase tracking-wider">History & Rhetoric</p>
                            
                            <ul class="space-y-4 text-sm text-stone-600">
                                <li class="flex flex-col items-start">

                                    <div class="mb-1">分析弥迦如何利用希伯来地名的发音（如“伯亚弗拉”与“灰尘”）来传达预言信息。这需要参考原文词根。</div>
                                    <div class="text-xs italic text-stone-400 en-text">Analyzing Hebrew plays on words (e.g., Beth Leaphrah & Dust) to convey prophetic doom.</div>
                                </li>
                                <li class="flex flex-col items-start border-t border-stone-100 pt-3">
                                    <div class="flex items-center font-bold text-stone-800 mb-1"><i class="fas fa-check-circle mr-2 text-violet-500"></i> 历史背景 (Historical Setting)</div>
                                    <div class="mb-1">将经文置于公元前8世纪亚述帝国西进的背景下，理解“城门”和“伤痕”的具体历史指向。</div>
                                    <div class="text-xs italic text-stone-400 en-text">Placing the text in the context of the 8th-century BC Assyrian expansion.</div>
                                </li>
                            </ul>
                        </div>

                        <!-- Devotional Card -->
                        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-md border-t-4 border-rose-700">
                            <div class="text-rose-700 text-3xl mb-4"><i class="fas fa-candle-holder"></i></div>
                            <h3 class="text-lg font-bold text-stone-800 mb-2">属灵应用 (Spiritual Application)</h3>

                            <ul class="space-y-4 text-sm text-stone-600">
                                <li class="flex flex-col items-start">
                                    <div class="flex items-center font-bold text-stone-800 mb-1"><i class="fas fa-check-circle mr-2 text-rose-500"></i> 情感共鸣 (Affective Resonance)</div>
                                    <div class="mb-1">不只关注审判的事实，更体会神和先知在审判背后的悲伤情感（哀号、赤身）。</div>
                                    <div class="text-xs italic text-stone-400 en-text">Feeling the grief of God and the prophet behind the judgment, not just the facts.</div>
                                </li>
                                <li class="flex flex-col items-start border-t border-stone-100 pt-3">
                                    <div class="flex items-center font-bold text-stone-800 mb-1"><i class="fas fa-check-circle mr-2 text-rose-500"></i> 偶像的现代意义 (Modern Idolatry)</div>
                                    <div class="mb-1">将古代的雕刻偶像转化为现代人心中的安全感来源（金钱、地位），并应用“蜡化在火中”的原则。</div>
                                    <div class="text-xs italic text-stone-400 en-text">Translating ancient idols into modern sources of security and applying the "melting wax" principle.</div>
                                </li>

                    </div>
                </div>
            `;
        }
    </script>
    <script src="../../Assets/js/chapter-settings.js"></script>
