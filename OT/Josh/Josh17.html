<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            /* Forest Green - The Mountain Forest */
            --theme-primary: #166534; 
            /* Cold Iron - The Chariots */
            --theme-secondary: #475569;
            /* Royal Purple - Zelophehad's Daughters */
            --theme-accent: #7e22ce;
            /* Wood/Forest Background */
            --theme-bg: #f0fdf4;
            /* Text */
            --theme-text: #052e16;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--theme-bg);
            color: var(--theme-text);
            /* Tree rings texture effect */
            background-image: radial-gradient(circle at center, transparent 0%, transparent 40%, rgba(22, 101, 52, 0.03) 40%, rgba(22, 101, 52, 0.03) 42%, transparent 42%);
            background-size: 60px 60px;
        }

        .en-text {
            font-family: 'Playfair Display', serif;
        }

        h1, h2, h3, .serif {
            font-family: 'Noto Serif SC', serif;
        }

        /* Navigation Styling */
        .nav-btn {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .active-tab {
            color: var(--theme-primary);
            font-weight: 700;
        }
        .active-tab::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--theme-primary);
            border-radius: 2px;
        }

        /* Card Styling */
        .verse-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(22, 101, 52, 0.1);
            transition: all 0.3s ease;
            border: 1px solid #bbf7d0;
            border-left: 4px solid var(--theme-primary);
            overflow: hidden;
            margin-bottom: 2rem;
            position: relative;
        }
        .verse-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(22, 101, 52, 0.2);
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Forest Clearing Animation */
        .forest-container {
            position: relative;
            height: 160px;
            width: 100%;
            background: #dcfce7;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #86efac;
        }
        .tree {
            position: absolute;
            bottom: 0;
            color: #15803d;
            font-size: 24px;
            transition: all 0.5s ease;
        }
        /* Axe swing animation */
        .axe {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: #475569;
            animation: chop 2s infinite;
            z-index: 10;
        }
        @keyframes chop {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-45deg) translate(-10px, 10px); }
            100% { transform: rotate(0deg); }
        }
        .falling-tree {
            animation: fallOver 1s forwards;
            opacity: 0.5;
        }
        @keyframes fallOver {
            to { transform: rotate(90deg) translateY(20px); opacity: 0; }
        }

        /* Iron Chariot Wheel */
        .chariot-container {
            position: relative;
            height: 120px;
            width: 120px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .iron-wheel {
            width: 80px;
            height: 80px;
            border: 6px solid #334155;
            border-radius: 50%;
            position: relative;
            animation: rollWheel 3s infinite linear;
            background: rgba(51, 65, 85, 0.1);
        }
        .spike {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #334155;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .spike-top { top: -8px; left: 50%; transform: translateX(-50%); }
        .spike-bottom { bottom: -8px; left: 50%; transform: translateX(-50%) rotate(180deg); }
        .spike-left { left: -8px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
        .spike-right { right: -8px; top: 50%; transform: translateY(-50%) rotate(90deg); }
        
        .wheel-spoke {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background: #334155;
            transform: translateY(-50%);
        }
        .wheel-spoke.vertical {
            transform: translateY(-50%) rotate(90deg);
        }

        @keyframes rollWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Badge */
        .section-badge {
            background-color: var(--theme-primary);
            color: white;
            font-family: 'Playfair Display', serif;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1rem;
            box-shadow: 0 2px 4px rgba(22, 101, 52, 0.3);
            margin-right: 1rem;
        }
    </style>
</head>

    <script>

        const chapterData = {

                summary_zh: "约书亚记第17章继续讲述约瑟家族（主要是玛拿西支派）的分地。本章有两个焦点：一是西罗非哈的女儿们勇敢争取继承权，展现了信心的主动性；二是约瑟子孙虽然自夸为‘族大’，却不敢去征服拥有铁车的迦南人，反倒向约书亚抱怨地太小。约书亚发出了著名的挑战：如果你真的族大，就去砍伐树林，去赶出铁车。这是从‘坐享其成’到‘主动开拓’的呼召。",

        function renderStudy() {
            const container = document.getElementById('app-content');
            
            // Header for Study View
            const headerHTML = `
                <div class="text-center mb-8 fade-in">
                    <h2 class="text-2xl font-bold text-stone-800 serif">深入研读与灵修</h2>

                    <div class="w-24 h-1 bg-green-700 mx-auto mt-4 rounded-full"></div>

            `;

            let sectionsHTML = '';
            chapterData.sections.forEach((section, index) => {
                sectionsHTML += `
                    <div class="max-w-4xl mx-auto mb-12 fade-in" style="animation-delay: ${index * 0.1}s">

                        <div class="flex items-center mb-6 border-b border-green-200 pb-2">

                        <div class="space-y-6">

                `;
            });

            container.innerHTML = headerHTML + sectionsHTML;
        }

                        <p class="text-stone-800 font-serif text-lg leading-relaxed mb-3 relative z-10">
                            ${verse.text_zh}

                        <p class="text-stone-500 font-serif text-sm italic en-text pl-4 border-l-2 border-stone-300">

                    <div class="flex flex-col md:flex-row">

                            <p class="text-sm text-stone-700 leading-relaxed text-justify mb-2 opacity-90">${verse.devotional.content_zh}</p>
                            <p class="text-xs text-amber-800/60 font-serif italic en-text mt-3">${verse.devotional.content_en}</p>

                    </div>

        }
