<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malachi 3: Refining & Blessing | 玛拉基书第三章</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap');

        :root {
            /* Refiner's Fire / Gold / Purification */
            --theme-fire: #b45309; /* Amber 700 */
            --theme-fire-glow: #f59e0b; /* Amber 500 */
            /* Fuller's Soap / Cleansing */
            --theme-soap: #0e7490; /* Cyan 700 */
            /* Storehouse / Provision */
            --theme-store: #15803d; /* Green 700 */
            /* Background */
            --theme-bg: #fffbeb; /* Amber 50 */
            /* Text */
            --theme-text: #271c19; /* Stone 900 */
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--theme-bg);
            color: var(--theme-text);
            /* Texture: Heat haze / Sparks */
            background-image: radial-gradient(#fcd34d 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .en-title { font-family: 'Cinzel', serif; }
        .en-text { font-family: 'Lato', sans-serif; }
        h1, h2, h3, .serif { font-family: 'Noto Serif SC', serif; }

        /* Navigation */
        .nav-btn {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .active-tab {
            color: var(--theme-fire);
            font-weight: 700;
        }
        .active-tab::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background-color: var(--theme-fire);
            border-radius: 2px;
        }

        /* Card Styling */
        .verse-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid #fde68a;
            overflow: hidden;
            position: relative;
        }
        .verse-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(180, 83, 9, 0.2);
            border-color: var(--theme-fire);
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Crucible Animation */
        .crucible-container {
            width: 80px;
            height: 60px;
            position: relative;
            margin: 0 auto;
        }
        .crucible-pot {
            width: 100%;
            height: 100%;
            background: #444;
            border-radius: 0 0 40px 40px;
            position: relative;
            overflow: hidden;
            border: 2px solid #222;
        }
        .molten-gold {
            width: 100%;
            height: 80%;
            background: linear-gradient(to top, #ea580c, #facc15);
            position: absolute;
            bottom: 0;
            left: 0;
            animation: boil 2s infinite ease-in-out alternate;
            opacity: 0.9;
        }
        .bubble {
            position: absolute;
            background: #fef08a;
            border-radius: 50%;
            animation: bubblePop 1.5s infinite;
        }
        .bubble:nth-child(1) { width: 8px; height: 8px; left: 20%; top: 40%; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 12px; height: 12px; left: 60%; top: 30%; animation-delay: 0.5s; }
        .bubble:nth-child(3) { width: 6px; height: 6px; left: 40%; top: 60%; animation-delay: 1s; }

        @keyframes boil {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(1.05); }
        }
        @keyframes bubblePop {
            0% { transform: scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Blessing Pour Animation */
        .window-container {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto;
        }
        .window-frame {
            width: 100%;
            height: 20px;
            border: 2px solid var(--theme-store);
            border-bottom: none;
            position: absolute;
            top: 0;
        }
        .pour-stream {
            width: 40px;
            height: 60px;
            background: linear-gradient(to bottom, var(--theme-store), transparent);
            position: absolute;
            top: 10px;
            left: 10px;
            opacity: 0.6;
            animation: pour 1s infinite linear;
        }
        @keyframes pour {
            0% { background-position: 0 0; }
            100% { background-position: 0 20px; }
        }

        /* Pulse Text */
        .text-glow {
            animation: textGlow 2s infinite alternate;
        }
        @keyframes textGlow {
            from { text-shadow: 0 0 5px rgba(245, 158, 11, 0.2); }
            to { text-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }
        }

    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white/95 backdrop-blur-md sticky top-0 z-50 border-b border-amber-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center mr-3 text-amber-800 border border-amber-300">
                        <i class="fas fa-fire-alt"></i>
                    </div>
                    <span class="text-lg sm:text-xl font-bold text-stone-800 serif flex flex-col leading-none">
                        <span>玛拉基书 <span class="text-amber-700">3章</span></span>
                        <span class="text-[9px] sm:text-[10px] text-stone-500 en-title tracking-widest mt-1">REFINER'S FIRE</span>
                    </span>
                </div>
                <div class="flex space-x-6">
                    <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn active-tab text-sm font-medium text-stone-600">
                        <i class="fas fa-chart-pie block sm:hidden"></i>
                        <span class="hidden sm:block">全景 Overview</span>
                    </button>
                    <button onclick="navigate('study')" id="nav-study" class="nav-btn text-sm font-medium text-stone-600">
                        <i class="fas fa-book-open block sm:hidden"></i>
                        <span class="hidden sm:block">研读 Study</span>
                    </button>
                    <button onclick="navigate('methodology')" id="nav-methodology" class="nav-btn text-sm font-medium text-stone-600">
                        <i class="fas fa-microscope block sm:hidden"></i>
                        <span class="hidden sm:block">原则 Method</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app-content" class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 py-8 w-full">
        <!-- JS Injected Content -->
    </main>

    <!-- Footer -->
    <footer class="bg-[#451a03] text-amber-200 mt-auto border-t-4 border-amber-600">
        <div class="max-w-6xl mx-auto py-8 px-4 text-center">
            <p class="text-base font-serif italic text-amber-50 mb-1">"万军之耶和华说：我必斥责为你们吞噬田产的..."</p>
            <p class="text-xs italic opacity-60 en-text">"I will rebuke the devourer for you..." (Malachi 3:11)</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- Data ---
        const chapterData = {
            intro: {
                title: "烈火般的爱与敞开的天窗",
                title_en: "Fiery Love & Open Windows",
                summary_zh: "玛拉基书第3章是全书的高潮。面对百姓的冷漠与悖逆，神宣告祂将如‘立约的使者’忽然临到。祂的临到不是为了毁灭，而是为了‘熬炼’（Refine），如火炼金，如碱漂布。本章著名的关于什一奉献的教导，实际上是神邀请百姓透过顺服来‘试探’祂的信实。神应许：只要回转，天上的窗户必敞开，地上的吞噬者必被斥责。",
                summary_en: "Malachi 3 is the climax. Facing apathy, God announces He will come suddenly as the 'Messenger of the Covenant'. He comes not to destroy but to 'Refine'—like fire for gold and soap for cloth. The famous teaching on tithing is actually an invitation to 'test' God's faithfulness. The promise: Return, and the windows of heaven will open, and the devourer will be rebuked.",
                concepts: [
                    {
                        title: "炼金之人的火", title_en: "Refiner's Fire", hebrew: "Esh Metzaref",
                        icon: "fa-fire", color: "text-amber-600",
                        desc_zh: "神是炼金者。火的目的不是烧毁金子，而是烧掉杂质（渣滓）。这是一个极其痛苦但充满希望的过程，目的是恢复利未人献祭的‘公义’。",
                        desc_en: "God is the Refiner. Fire doesn't destroy the gold; it removes the dross. A painful but hopeful process to restore righteousness in offering."
                    },
                    {
                        title: "漂布之人的碱", title_en: "Fuller's Soap", hebrew: "Borit Kobesim",
                        icon: "fa-soap", color: "text-cyan-600",
                        desc_zh: "碱（肥皂）用于强力清洗衣物，不仅是去除表面污渍，更是透过捶打和化学作用洁净纤维深处。象征神对罪恶彻底的洁净。",
                        desc_en: "Lye/Soap used for deep cleaning cloth. It involves scrubbing and chemical action to cleanse deep fibers. Symbolizes thorough cleansing from sin."
                    },
                    {
                        title: "特特归我", title_en: "Treasured Possession", hebrew: "Segullah",
                        icon: "fa-gem", color: "text-purple-600",
                        desc_zh: "在万民中，神视那些敬畏祂的人为‘皇家私有财产’（Segullah）。如同君王的私人珠宝箱，被珍藏和记念。",
                        desc_en: "God views those who fear Him as His 'Segullah'—a royal private treasure. Like a king's personal jewel box, cherished and remembered."
                    }
                ]
            },
            sections: [
                {
                    title: "立约使者的忽然临到 (3:1-6)",
                    title_en: "The Messenger & The Refiner",
                    verses: [
                        {
                            ref: "3:2-3",
                            text_zh: "他来的日子，谁能当得起呢？...因为他如炼金之人的火，如漂布之人的碱。他必坐下如炼净银子的...",
                            text_en: "But who can endure the day of his coming? ... For he is like a refiner's fire and like fullers' soap. He will sit as a refiner and purifier of silver...",
                            exegesis: {
                                title: "坐着的炼金者 (The Sitting Refiner)",
                                content_zh: "经文描绘神‘坐下’（Sits）炼银子。这显示了极大的耐心和专注。炼金者必须盯着熔炉，直到在银液中能清晰看见自己的倒影，才算炼净。这里的预言具有双重指向：近指施洗约翰（铺路）和耶稣的第一次降临（洁净圣殿），远指末世的审判。神不仅要洁净利未人（领袖），也要审判行邪术和欺压人的（5节）。",
                                content_en: "God 'sits' to refine. This implies patience and focus. A refiner watches the pot until he sees his own reflection in the metal. The prophecy points to John the Baptist/Jesus (first coming) and final judgment. He purifies leaders (Levi) and judges oppressors (v5)."
                            },
                            devotional: {
                                title: "火是为了你的益处 (The Fire is for You)",
                                content_zh: "当你感到生活像个熔炉——压力、痛苦、剥夺接踵而至时，不要以为神在毁灭你。祂是‘坐着’的，祂的眼睛从未离开你。祂在等待看见祂的形象在你生命中从新浮现。这火不是为了烧死你，而是为了烧掉那些让你生命失去光泽的杂质（罪、骄傲、依赖）。",
                                content_en: "When life feels like a furnace, God isn't destroying you. He is 'sitting' and watching. He waits to see His reflection in you. The fire burns the dross (sin, pride), not the gold. Trust the Refiner's hand."
                            }
                        }
                    ]
                },
                {
                    title: "当纳的十分之一 (3:7-12)",
                    title_en: "Tithes & The Open Window",
                    verses: [
                        {
                            ref: "3:8, 10",
                            text_zh: "人岂可夺取神之物呢？你们竟夺取我的供物...你们要将当纳的十分之一全然送入仓库...以此试试我...",
                            text_en: "Will man rob God? Yet you are robbing me... Bring the full tithe into the storehouse... and thereby put me to the test...",
                            exegesis: {
                                title: "唯一的‘试试我’ (The Only 'Test Me')",
                                content_zh: "这是圣经中唯一一处神允许甚至命令人‘试探’（Test/Prove）祂的地方。什一奉献（Tithe）在旧约是神权统治的税收，用于支持利未人和圣殿运作。‘夺取’（Rob）是很重的指控，意为私吞公款。神应许的‘敞开天上的窗户’不仅指雨水（农业社会），更指一切属灵和物质的福分。‘斥责吞噬者’（蝗虫）表明神会以此保护剩下的90%。",
                                content_en: "The only place God invites us to 'test' Him. Tithing was thetax for the Theocracy/Temple. 'Robbing' means embezzlement. 'Open windows' implies abundant rain and blessing. God also promises to 'rebuke the devourer' (locusts), protecting the remaining 90%."
                            },
                            devotional: {
                                title: "这是一个信任问题 (It's a Trust Issue)",
                                content_zh: "神真的缺钱吗？不，千山的牛都是祂的。神设立奉献是为了医治我们的贪婪和惧怕。当我们扣留奉献时，我们在说：‘神啊，我不相信你能养活我，我得靠自己抓紧这笔钱。’ 什一奉献是信心的具体行动。你敢不敢在这个月‘试试’神？看看当你尊荣祂时，祂如何为你斥责那莫名其妙的‘吞噬者’（意外的破财）。",
                                content_en: "Does God need money? No. Giving heals our greed and fear. Withholding says, 'God, I don't trust You to provide.' Tithing is faith in action. Dare to 'test' Him this month? Watch how He rebukes the 'devourer' (unexpected expenses) when you honor Him."
                            }
                        }
                    ]
                },
                {
                    title: "纪念册与分别善恶 (3:13-18)",
                    title_en: "Book of Remembrance & Distinction",
                    verses: [
                        {
                            ref: "3:16-17",
                            text_zh: "那时，敬畏耶和华的彼此谈论，耶和华侧耳而听，且有纪念册在他面前...他们必特特归我...",
                            text_en: "Then those who feared the LORD spoke with one another. The LORD paid attention and heard them, and a book of remembrance was written... They shall be mine... my treasured possession.",
                            exegesis: {
                                title: "神在偷听吗？ (God Eavesdrops)",
                                content_zh: "这是非常动人的一幕。当周围的人都在顶撞神说‘事奉神是徒然的’（14节）时，有一小群‘余民’彼此鼓励。神‘侧耳而听’（Paid attention），并吩咐记录在册。‘特特归我’（Segullah）是专有名词，指君王的私房宝藏。这表明神极其看重在弯曲悖谬世代中依然持守信心的人。",
                                content_en: "A moving scene. While the majority complained 'It is vain to serve God' (v14), a remnant encouraged each other. God 'leaned in' to listen. He recorded it. 'Segullah' means royal private treasure. God deeply values those who keep faith in a cynical age."
                            },
                            devotional: {
                                title: "你的谈话被记录了 (Recorded Conversations)",
                                content_zh: "当你和属灵同伴在咖啡馆、家里彼此鼓励、数算神恩典时，不要以为那是微不足道的闲聊。全宇宙的主宰正在‘侧耳而听’，并叫天使记录下来！在这个充满抱怨的世界里，充满信心的‘彼此谈论’是神眼中的珍宝。今天，去找个同伴说些造就信心的话吧。",
                                content_en: "When you encourage a friend in faith, it's not idle chatter. The Sovereign Lord is 'eavesdropping' and recording it! In a complaining world, faith-filled conversation is a jewel to God. Go speak life to someone today; God is listening."
                            }
                        }
                    ]
                }
            ]
        };

        // --- State ---
        let appState = { view: 'dashboard' };

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => renderDashboard());

        // --- Navigation ---
        function navigate(view) {
            appState.view = view;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active-tab');
                btn.classList.add('text-stone-600');
            });
            document.getElementById(`nav-${view}`).classList.add('active-tab');
            document.getElementById(`nav-${view}`).classList.remove('text-stone-600');

            const container = document.getElementById('app-content');
            container.style.opacity = '0';
            setTimeout(() => {
                if (view === 'dashboard') renderDashboard();
                if (view === 'study') renderStudy();
                if (view === 'methodology') renderMethodology();
                container.style.opacity = '1';
                window.scrollTo(0,0);
            }, 200);
        }

        // --- Renders ---
        function renderDashboard() {
            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6 fade-in">
                    <!-- Title & Visual -->
                    <div class="md:col-span-8 bg-white border border-stone-200 rounded-2xl p-6 sm:p-8 shadow-sm relative overflow-hidden">
                        
                        <div class="flex flex-col sm:flex-row items-start justify-between z-10 relative">
                            <div class="flex-1">
                                <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full mb-3 uppercase tracking-wider">Chapter Theme</span>
                                <h1 class="text-3xl sm:text-4xl font-bold text-stone-800 serif mb-2 text-glow">${chapterData.intro.title}</h1>
                                <h2 class="text-lg text-stone-500 en-title mb-6 italic">${chapterData.intro.title_en}</h2>
                                <p class="text-sm text-stone-600 leading-relaxed border-l-4 border-amber-600 pl-4 text-justify mb-6">
                                    ${chapterData.intro.summary_zh}
                                </p>
                            </div>

                            <!-- Visualization: Crucible -->
                            <div class="mt-6 sm:mt-0 sm:ml-8 flex flex-col items-center">
                                <div class="crucible-container">
                                    <div class="crucible-pot">
                                        <div class="molten-gold">
                                            <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
                                        </div>
                                    </div>
                                    <!-- Fire -->
                                    <div class="flex justify-center -mt-2 space-x-1">
                                        <div class="w-2 h-4 bg-orange-500 rounded-t-full animate-bounce"></div>
                                        <div class="w-2 h-6 bg-red-500 rounded-t-full animate-bounce" style="animation-delay: 0.1s"></div>
                                        <div class="w-2 h-5 bg-yellow-500 rounded-t-full animate-bounce" style="animation-delay: 0.2s"></div>
                                    </div>
                                </div>
                                <p class="text-[10px] text-stone-400 mt-2 font-mono uppercase text-center">Refining Gold</p>
                            </div>
                        </div>
                    </div>

                    <!-- Mood / Stats -->
                    <div class="md:col-span-4 flex flex-col gap-4">
                        <!-- Open Window Visual -->
                        <div class="bg-green-50 border border-green-200 rounded-xl p-6 shadow-sm flex-1 flex flex-col justify-center items-center text-center relative overflow-hidden">
                            <div class="window-container mb-2">
                                <div class="window-frame"></div>
                                <div class="pour-stream"></div>
                            </div>
                            <h3 class="font-bold text-lg text-green-800">Open Windows</h3>
                            <p class="text-xs text-green-600 uppercase tracking-widest">Test Me (v10)</p>
                        </div>
                        
                        <div class="bg-stone-800 text-stone-200 rounded-xl p-6 shadow-md flex-1 flex flex-col justify-center items-center text-center">
                            <i class="fas fa-book text-3xl text-purple-400 mb-2"></i>
                            <h3 class="font-bold text-lg">Remembrance</h3>
                            <p class="text-xs text-stone-400 uppercase tracking-widest">A Book Written</p>
                        </div>
                    </div>

                    <!-- Concepts -->
                    <div class="md:col-span-12">
                        <h3 class="text-sm font-bold text-stone-400 uppercase tracking-widest mb-4">Key Themes</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            ${chapterData.intro.concepts.map(c => `
                                <div class="bg-white p-5 rounded-xl border border-stone-200 shadow-sm hover:shadow-md transition group">
                                    <div class="flex items-center mb-2">
                                        <i class="fas ${c.icon} ${c.color} mr-2 group-hover:scale-110 transition duration-300"></i>
                                        <h4 class="font-bold text-stone-700">${c.title}</h4>
                                    </div>
                                    <p class="text-[10px] text-stone-400 font-mono mb-2">${c.hebrew} <span class="mx-1">|</span> ${c.title_en}</p>
                                    <p class="text-xs text-stone-600 leading-relaxed text-justify">${c.desc_zh}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudy() {
            const container = document.getElementById('app-content');
            
            let html = `
                <div class="max-w-3xl mx-auto fade-in">
                    <div class="text-center mb-10">
                        <h2 class="text-2xl font-bold text-stone-800 serif">逐节研读</h2>
                        <div class="w-16 h-1 bg-amber-600 mx-auto mt-3 rounded-full"></div>
                    </div>
            `;

            chapterData.sections.forEach(section => {
                html += `
                    <div class="mb-12">
                        <!-- Section Header -->
                        <div class="flex items-center mb-4 border-b border-stone-200 pb-2">
                            <div class="w-8 h-8 rounded bg-amber-100 text-amber-800 flex items-center justify-center text-xs mr-3 font-bold border border-amber-200">
                                <i class="fas fa-scroll"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-stone-800">${section.title}</h3>
                                <p class="text-xs text-stone-500 en-text italic">${section.title_en}</p>
                            </div>
                        </div>

                        <div class="space-y-8">
                            ${section.verses.map(verse => `
                                <div class="verse-card">
                                    <!-- Scripture -->
                                    <div class="p-6 bg-stone-50 border-b border-stone-100 relative">
                                        <span class="absolute top-4 right-4 text-[10px] font-bold text-stone-500 bg-white border border-stone-200 px-2 py-0.5 rounded">${verse.ref}</span>
                                        <p class="text-stone-800 text-lg font-serif mb-3 leading-relaxed relative z-10">
                                            ${verse.text_zh}
                                        </p>
                                        <p class="text-stone-500 text-sm italic en-text pl-3 border-l-2 border-amber-300">
                                            ${verse.text_en}
                                        </p>
                                    </div>
                                    
                                    <!-- Analysis Grid -->
                                    <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-stone-100">
                                        <!-- Meaning -->
                                        <div class="p-6">
                                            <div class="flex items-center mb-3">
                                                <div class="w-6 h-6 rounded bg-stone-100 flex items-center justify-center mr-2 text-stone-500 text-xs"><i class="fas fa-glasses"></i></div>
                                                <h4 class="text-xs font-bold text-stone-500 uppercase tracking-widest">经文含义 Meaning</h4>
                                            </div>
                                            <h5 class="text-sm font-bold text-stone-800 mb-2">${verse.exegesis.title}</h5>
                                            <p class="text-xs sm:text-sm text-stone-600 leading-relaxed text-justify mb-2">${verse.exegesis.content_zh}</p>
                                            <p class="text-[10px] text-stone-400 italic en-text">${verse.exegesis.content_en}</p>
                                        </div>

                                        <!-- Devotional -->
                                        <div class="p-6 bg-amber-50/50">
                                            <div class="flex items-center mb-3">
                                                <div class="w-6 h-6 rounded bg-amber-100 flex items-center justify-center mr-2 text-amber-600 text-xs"><i class="fas fa-heart"></i></div>
                                                <h4 class="text-xs font-bold text-amber-600 uppercase tracking-widest">灵修应用 Devotional</h4>
                                            </div>
                                            <h5 class="text-sm font-bold text-amber-800 mb-2">${verse.devotional.title}</h5>
                                            <p class="text-xs sm:text-sm text-stone-700 leading-relaxed text-justify mb-2">${verse.devotional.content_zh}</p>
                                            <p class="text-[10px] text-amber-800/60 italic en-text">${verse.devotional.content_en}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function renderMethodology() {
            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="max-w-4xl mx-auto fade-in">
                    <div class="text-center mb-10">
                        <h2 class="text-2xl font-bold text-stone-800 serif">解经与灵修的整合</h2>
                        <p class="text-xs text-stone-500 en-text uppercase tracking-widest">Integrating Exegesis & Application</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Principle 1 -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-stone-500">
                            <div class="mb-4 text-stone-600 text-2xl"><i class="fas fa-balance-scale-right"></i></div>
                            <h3 class="font-bold text-stone-800 mb-2">律法与恩典的桥梁 (Bridging Law & Grace)</h3>
                            <p class="text-sm text-stone-600 mb-3 text-justify">
                                处理“什一奉献”等律法议题时，不要陷入律法主义（为了得救而奉献），也不要陷入反律法主义（因为恩典所以不奉献）。解经原则是：律法揭示了神的属性（慷慨、公义）。在新约恩典下，我们的标准往往是“更超越”的（全人奉献），而非废除。
                            </p>
                            <div class="bg-stone-50 p-2 rounded text-xs text-stone-500 italic">
                                <strong>Principle:</strong> Grace enables greater generosity, not less.
                            </div>
                        </div>

                        <!-- Principle 2 -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-amber-600">
                            <div class="mb-4 text-amber-600 text-2xl"><i class="fas fa-sync"></i></div>
                            <h3 class="font-bold text-stone-800 mb-2">炼净而非毁灭 (Purging vs consuming)</h3>
                            <p class="text-sm text-stone-600 mb-3 text-justify">
                                在解释“烈火”等审判性经文时，必须区分“针对信徒的管教之火”和“针对恶人的毁灭之火”。对于神的子民（如利未人），火是**建设性**的。灵修时要帮助读者在苦难中看到神的“坐下熬炼”，从而生发盼望而非绝望。
                            </p>
                            <div class="bg-amber-50 p-2 rounded text-xs text-amber-800 italic">
                                <strong>Hope:</strong> The Refiner knows when the gold is ready.
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
    <script src="../../Assets/js/chapter-settings.js"></script>
</body>
