<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malachi 4: Healing & Judgment | 玛拉基书第四章</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap');

        :root {
            /* Sun of Righteousness / Healing */
            --theme-sun: #f59e0b; /* Amber 500 */
            --theme-light: #fef3c7; /* Amber 100 */
            /* Oven / Judgment / Ash */
            --theme-ash: #1c1917; /* Stone 900 */
            --theme-fire: #ef4444; /* Red 500 */
            /* Calves / Life / Leap */
            --theme-life: #15803d; /* Green 700 */
            /* Background */
            --theme-bg: #fff7ed; /* Orange 50 */
            /* Text */
            --theme-text: #451a03; /* Amber 950 */
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--theme-bg);
            color: var(--theme-text);
            /* Texture: Warm light rays */
            background-image: repeating-linear-gradient(45deg, rgba(251, 191, 36, 0.05) 0px, rgba(251, 191, 36, 0.05) 2px, transparent 2px, transparent 10px);
        }

        .en-title { font-family: 'Cinzel', serif; }
        .en-text { font-family: 'Lato', sans-serif; }
        h1, h2, h3, .serif { font-family: 'Noto Serif SC', serif; }

        /* Navigation */
        .nav-btn {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .active-tab {
            color: var(--theme-sun);
            font-weight: 700;
        }
        .active-tab::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background-color: var(--theme-sun);
            border-radius: 2px;
        }

        /* Card Styling */
        .verse-card {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid #fed7aa;
            overflow: hidden;
            position: relative;
        }
        .verse-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -3px rgba(245, 158, 11, 0.2);
            border-color: var(--theme-sun);
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Sunrise Animation */
        .sunrise-container {
            width: 100px;
            height: 60px;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            border-bottom: 2px solid #444;
        }
        .sun-body {
            width: 40px;
            height: 40px;
            background: linear-gradient(to top, #f59e0b, #fbbf24);
            border-radius: 50%;
            position: absolute;
            bottom: -20px;
            left: 30px;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
            animation: rise 4s infinite ease-in-out;
        }
        .sun-ray {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: rgba(245, 158, 11, 0.6);
            transform-origin: bottom center;
            opacity: 0;
            animation: radiate 4s infinite ease-in-out;
        }
        .ray-1 { height: 30px; transform: rotate(-45deg); animation-delay: 0.5s; }
        .ray-2 { height: 40px; transform: rotate(0deg); animation-delay: 0.7s; }
        .ray-3 { height: 30px; transform: rotate(45deg); animation-delay: 0.9s; }

        @keyframes rise {
            0%, 100% { bottom: -20px; opacity: 0.5; transform: scale(0.9); }
            50% { bottom: 10px; opacity: 1; transform: scale(1.1); }
        }
        @keyframes radiate {
            0%, 100% { height: 0; opacity: 0; }
            50% { height: 35px; opacity: 1; }
        }

        /* Turning Hearts Animation */
        .heart-container {
            width: 80px;
            height: 60px;
            position: relative;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .heart-shape {
            font-size: 24px;
            transition: all 0.5s;
            position: absolute;
        }
        .heart-left { 
            color: #57534e; /* Father (Old) - Stone */
            left: 10px;
            animation: turnLeft 4s infinite ease-in-out;
        }
        .heart-right { 
            color: #f59e0b; /* Children (New) - Amber */
            right: 10px;
            animation: turnRight 4s infinite ease-in-out;
        }

        @keyframes turnLeft {
            0% { transform: rotate(-90deg); left: 0px; opacity: 0.5; }
            50% { transform: rotate(0deg); left: 25px; opacity: 1; color: #be123c; } /* Meet in middle, turn red */
            100% { transform: rotate(-90deg); left: 0px; opacity: 0.5; }
        }
        @keyframes turnRight {
            0% { transform: rotate(90deg); right: 0px; opacity: 0.5; }
            50% { transform: rotate(0deg); right: 25px; opacity: 1; color: #be123c; }
            100% { transform: rotate(90deg); right: 0px; opacity: 0.5; }
        }

        /* Ash/Stubble Animation */
        .ash-particle {
            width: 4px;
            height: 4px;
            background: #444;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            animation: floatUp 3s infinite linear;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { bottom: 0; opacity: 1; transform: translateX(0); }
            100% { bottom: 30px; opacity: 0; transform: translateX(10px); }
        }

    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white/95 backdrop-blur-md sticky top-0 z-50 border-b border-orange-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center mr-3 text-amber-600 border border-amber-300">
                        <i class="fas fa-sun"></i>
                    </div>
                    <span class="text-lg sm:text-xl font-bold text-stone-800 serif flex flex-col leading-none">
                        <span>玛拉基书 <span class="text-amber-600">4章</span></span>
                        <span class="text-[9px] sm:text-[10px] text-stone-500 en-title tracking-widest mt-1">THE SUN RISES</span>
                    </span>
                </div>
                <div class="flex space-x-6">
                    <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn active-tab text-sm font-medium text-stone-600">

                    </button>
                </div>

        </div>
    </nav>

    <!-- Main Content -->
    <main id="app-content" class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 py-8 w-full">

    </main>

    <!-- Footer -->
    <footer class="bg-[#271c19] text-amber-200/60 mt-auto border-t-4 border-amber-500">
        <div class="max-w-6xl mx-auto py-8 px-4 text-center">
            <p class="text-base font-serif italic text-amber-50 mb-1">"必有公义的日头出现，其光线有医治之能。"</p>
            <p class="text-xs italic opacity-60 en-text">"The sun of righteousness shall rise with healing in its wings." (Malachi 4:2)</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- Data ---
        const chapterData = {
            intro: {
                title: "旧约的终局：烈火与晨光",
                title_en: "The Final Word: Fire & Sunrise",
                summary_zh: "玛拉基书第4章是旧约的终章，它不仅结束了小先知书，也结束了整个旧约时代的预言。本章极其简短（希伯来圣经中甚至归入第3章），却充满张力。它描绘了“耶和华大而可畏之日”的两个侧面：对狂傲人是“烧着的火炉”，对敬畏者是“医治的日头”。全书并未以某种辉煌的圣殿景象结束，而是以一个家庭关系的异象——“父亲的心转向儿女”——作为迎接弥赛亚的最后准备。",
                summary_en: "Malachi 4 is the finale of the Old Testament. Though brief, it is charged with tension. It depicts the two faces of the 'Day of the Lord': a 'burning oven' for the proud, and a 'healing sun' for the reverent. The OT doesn't end with a temple vision, but with a relational one—'hearts of fathers turning to children'—as the final preparation for the Messiah.",
                concepts: [
                    {
                        title: "公义的日头", title_en: "Sun of Righteousness", hebrew: "Shemesh Tzedakah",
                        icon: "fa-sun", color: "text-amber-500",
                        desc_zh: "这是旧约最美的弥赛亚称呼之一。与第1节毁灭性的“火”形成对比，这“日头”带来光明、温暖和医治。对义人而言，审判日不是黑暗，而是黎明。",
                        desc_en: "One of the most beautiful Messianic titles. Contrasts with the destructive 'fire' (v1). This Sun brings light, warmth, and healing. Judgment Day is dawn, not dark, for the righteous."
                    },
                    {
                        title: "肥牛犊", title_en: "Stall-fed Calves", hebrew: "Eglim",
                        icon: "fa-cow", color: "text-green-600",
                        desc_zh: "形容被长时间关在圈里的牛犊，一旦放出，就会因重获自由而兴奋跳跃。象征信徒在公义彰显时的极度喜乐与释放。",
                        desc_en: "Imagery of calves confined in a stall. When released, they leap with explosive joy. Symbolizes the believer's exuberant liberation when justice finally dawns."
                    },
                    {
                        title: "咒诅", title_en: "Destruction/Ban", hebrew: "Cherem",
                        icon: "fa-ban", color: "text-stone-800",
                        desc_zh: "旧约圣经的最后一个词（英文译本常作Destruction/Curse）。这是一种完全毁灭的禁令。这留下了巨大的悬念：如果人心不回转，结局就是毁灭。这呼唤着新约恩典的到来。",
                        desc_en: "The very last word of the OT. 'Cherem' means total devotion to destruction. A cliffhanger: without a change of heart, the end is doom. It cries out for the New Testament."
                    }
                ]
            },
            sections: [
                {
                    title: "火炉与碎秸：骄傲的终局 (4:1)",
                    title_en: "The Oven & The Stubble",
                    verses: [
                        {
                            ref: "4:1",
                            text_zh: "万军之耶和华说：那日临近，势如烧着的火炉。凡狂傲的和行恶的必如碎秸，在那日必被烧尽，根本枝条一无存留。",
                            text_en: "'For behold, the day is coming, burning like an oven, when all the arrogant and all evildoers will be stubble. The day that is coming shall set them ablaze,' says the LORD of hosts, 'so that it will leave them neither root nor branch.'",
                            exegesis: {
                                title: "彻底的除灭 (Total Eradication)",
                                content_zh: "第3章提到神是“炼金之火”（提炼），这里变成了“烧着的火炉”（毁灭）。对象是“狂傲人”（即那些说事奉神是徒然的人，3:15）。“碎秸”是收割后剩下的无用干草，极易燃。“根本枝条一无存留”是希伯来成语，意为断子绝孙，没有任何生机或后裔留存。这是对恶人结局最严厉的判词。",
                                content_en: "In Ch 3, God is a 'Refiner's Fire' (purifying); here, a 'Burning Oven' (consuming). The target is the 'Arrogant' (who mocked God in 3:15). 'Stubble' is dry, useless chaff. 'Neither root nor branch' is an idiom for total extinction—no ancestry (root) or posterity (branch) remains."
                            },
                            devotional: {
                                title: "骄傲是易燃物 (Pride is Flammable)",
                                content_zh: "在这个世界上，狂傲人往往看似像参天大树一样稳固。但神的视角不同：在永恒的火面前，骄傲只是干燥的碎秸。我们不需要嫉妒恶人的亨通，因为他们的根基是易燃的。灵修的功课是：检查我的生命中是否有“狂傲”的干草？只有谦卑在神面前，才能经过火的试验。",
                                content_en: "The arrogant look like sturdy trees now. But to God, pride is just dry stubble. Don't envy their success; their foundation is flammable. Devotional task: Check for 'stubble' of pride in your life. Only humility survives the fire."
                            }
                        }
                    ]
                },
                {
                    title: "日头与牛犊：义人的得胜 (4:2-3)",
                    title_en: "The Sun & The Calves",
                    verses: [
                        {
                            ref: "4:2",
                            text_zh: "但向你们敬畏我名的人必有公义的日头出现，其光线（原文作翅膀）有医治之能。你们必出来跳跃如圈里的肥牛犊。",
                            text_en: "But for you who fear my name, the sun of righteousness shall rise with healing in its wings. You shall go out leaping like calves from the stall.",
                            exegesis: {
                                title: "翅膀下的医治 (Healing in Wings)",
                                content_zh: "古代近东常将太阳描绘为有翅膀的圆盘（Winged Sun Disk），象征君王的保护。但这日头不是太阳神，而是耶和华公义的彰显。当这光照耀时，带来的不是灼伤，而是“医治”（Healing）。对于长期被罪恶压伤、被不公义禁锢的“余民”，这光意味着释放。他们将像“圈里的牛犊”被放出一样，充满无法抑制的生命力与喜乐。",
                                content_en: "ANE iconography often depicted the sun with wings, symbolizing royal protection. Here, it's God's righteousness manifest. It brings 'Healing', not burning. For the Remnant, crushed by injustice, this light is liberation. They leap like 'stall-fed calves' released—uncontainable joy and vitality."
                            },
                            devotional: {
                                title: "期待那场日出 (Wait for the Sunrise)",
                                content_zh: "如果你正处于漫长的黑夜（疾病、抑郁、不公），请抓住这个应许：日头必将升起。基督就是这公义的日头。当祂的光照进你的生命时，不仅驱散黑暗，更带来深层的医治。不要习惯于黑暗的“圈”，要准备好你的心，像牛犊一样预备跳跃，迎接自由。",
                                content_en: "If you are in a long night (sickness, depression, injustice), hold this promise: The Sun WILL rise. Christ is that Sun. His light brings deep healing. Don't get used to the dark 'stall'. Prepare your heart to leap like a calf into freedom."
                            }
                        }
                    ]
                },
                {
                    title: "最后的嘱咐：回归与和解 (4:4-6)",
                    title_en: "Final Charge: Return & Reconcile",
                    verses: [
                        {
                            ref: "4:5-6",
                            text_zh: "看哪...我必差遣先知以利亚到你们那里去。他必使父亲的心转向儿女，儿女的心转向父亲，免得我来咒诅遍地。",
                            text_en: "Behold, I will send you Elijah the prophet... And he will turn the hearts of fathers to their children and the hearts of children to their fathers, lest I come and strike the land with a decree of utter destruction.",
                            exegesis: {
                                title: "为什么是伊莱贾？ (Why Elijah?)",
                                content_zh: "摩西代表律法（v4），伊莱贾代表先知。旧约以这两个人物作结，指向变像山上的耶稣。伊莱贾（新约指施洗约翰）的任务是“心”的转向。这里的“父”既指列祖（回到亚伯拉罕的信心），也指家庭中真实的父子关系。社会崩解往往始于家庭破裂。神复兴的迹象，不是神迹奇事，而是人际关系（特别是两代人）的深层和解。",
                                content_en: "Moses = Law; Elijah = Prophets. They point to Jesus (Transfiguration). Elijah's task (fulfilled in John the Baptist) is turning 'hearts'. 'Fathers' implies Patriarchs (faith) and literal dads. Social collapse starts in the family. Revival isn't fireworks; it's deep relational reconciliation."
                            },
                            devotional: {
                                title: "家庭是属灵的战场 (Family is the Battlefield)",
                                content_zh: "旧约结束于对“家庭和解”的呼唤，这绝非偶然。如果我们的信仰不能使我们“心转向儿女/父母”，这信仰就是虚空的。你与父母或子女的关系如何？是否冷漠、隔绝？神说如果不恢复这关系，地就会受咒诅。今天，就让伊莱贾的灵（悔改的灵）在你的家中动工，迈出和解的第一步。",
                                content_en: "The OT ends calling for 'family reconciliation'. Not accidental. If faith doesn't turn our hearts to family, it's hollow. How is your relationship with parents/kids? Cold? God links family brokenness to a cursed land. Let the spirit of repentance work in your home today. Make the first move."
                            }
                        }
                    ]
                }
            ]
        };

        // --- State ---
        let appState = { view: 'dashboard' };

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => renderDashboard());

        // --- Navigation ---
        function navigate(view) {
            appState.view = view;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active-tab');
                btn.classList.add('text-stone-600');
            });
            document.getElementById(`nav-${view}`).classList.add('active-tab');
            document.getElementById(`nav-${view}`).classList.remove('text-stone-600');

            const container = document.getElementById('app-content');
            container.style.opacity = '0';
            setTimeout(() => {
                if (view === 'dashboard') renderDashboard();
                if (view === 'study') renderStudy();
                if (view === 'methodology') renderMethodology();
                container.style.opacity = '1';
                window.scrollTo(0,0);
            }, 200);
        }

        // --- Renders ---
        function renderDashboard() {
            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6 fade-in">
                    <!-- Title & Visual -->
                    <div class="md:col-span-8 bg-white border border-stone-200 rounded-2xl p-6 sm:p-8 shadow-sm relative overflow-hidden">
                        
                        <div class="flex flex-col sm:flex-row items-start justify-between z-10 relative">
                            <div class="flex-1">
                                <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full mb-3 uppercase tracking-wider">Chapter Theme</span>
                                <h1 class="text-3xl sm:text-4xl font-bold text-stone-800 serif mb-2">${chapterData.intro.title}</h1>
                                <h2 class="text-lg text-stone-500 en-title mb-6 italic">${chapterData.intro.title_en}</h2>
                                <p class="text-sm text-stone-600 leading-relaxed border-l-4 border-amber-500 pl-4 text-justify mb-6">

                                </p>

                            <!-- Visualization: Sunrise -->
                            <div class="mt-6 sm:mt-0 sm:ml-8 flex flex-col items-center">
                                <div class="sunrise-container">
                                    <div class="sun-body"></div>
                                    <div class="sun-ray ray-1"></div>
                                    <div class="sun-ray ray-2"></div>
                                    <div class="sun-ray ray-3"></div>
                                </div>
                                <p class="text-[10px] text-stone-400 mt-2 font-mono uppercase text-center">Healing Wings</p>
                            </div>
                        </div>
                    </div>

                    <!-- Mood / Stats -->
                    <div class="md:col-span-4 flex flex-col gap-4">
                        <!-- Turning Hearts Visual -->
                        <div class="bg-stone-50 border border-stone-200 rounded-xl p-6 shadow-sm flex-1 flex flex-col justify-center items-center text-center relative overflow-hidden">
                            <div class="heart-container mb-2">
                                <div class="heart-shape heart-left"><i class="fas fa-heart"></i></div>
                                <div class="heart-shape heart-right"><i class="fas fa-heart"></i></div>
                            </div>
                            <h3 class="font-bold text-lg text-stone-700">Reconciliation</h3>
                            <p class="text-xs text-stone-500 uppercase tracking-widest">Fathers & Children</p>
                        </div>
                        
                        <div class="bg-stone-900 text-stone-200 rounded-xl p-6 shadow-md flex-1 flex flex-col justify-center items-center text-center relative overflow-hidden">
                            <div class="ash-particle" style="left:20%; animation-delay:0s"></div>
                            <div class="ash-particle" style="left:50%; animation-delay:1s"></div>
                            <div class="ash-particle" style="left:80%; animation-delay:0.5s"></div>
                            <i class="fas fa-fire-extinguisher text-3xl text-red-500 mb-2"></i>
                            <h3 class="font-bold text-lg">Ashes</h3>
                            <p class="text-xs text-stone-400 uppercase tracking-widest">Fate of the Proud</p>
                        </div>
                    </div>

                    <!-- Concepts -->
                    <div class="md:col-span-12">
                        <h3 class="text-sm font-bold text-stone-400 uppercase tracking-widest mb-4">Key Themes</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            ${chapterData.intro.concepts.map(c => `
                                <div class="bg-white p-5 rounded-xl border border-stone-200 shadow-sm hover:shadow-md transition group">
                                    <div class="flex items-center mb-2">
                                        <i class="fas ${c.icon} ${c.color} mr-2 group-hover:scale-110 transition duration-300"></i>
                                        <h4 class="font-bold text-stone-700">${c.title}</h4>
                                    </div>
                                    <p class="text-[10px] text-stone-400 font-mono mb-2">${c.hebrew} <span class="mx-1">|</span> ${c.title_en}</p>
                                    <p class="text-xs text-stone-600 leading-relaxed text-justify">${c.desc_zh}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudy() {
            const container = document.getElementById('app-content');
            
            let html = `
                <div class="max-w-3xl mx-auto fade-in">
                    <div class="text-center mb-10">
                        <h2 class="text-2xl font-bold text-stone-800 serif">逐节研读</h2>
                        <div class="w-16 h-1 bg-amber-500 mx-auto mt-3 rounded-full"></div>
                    </div>
            `;

            chapterData.sections.forEach(section => {
                html += `
                    <div class="mb-12">
                        <!-- Section Header -->
                        <div class="flex items-center mb-4 border-b border-stone-200 pb-2">
                            <div class="w-8 h-8 rounded bg-amber-100 text-amber-600 flex items-center justify-center text-xs mr-3 font-bold border border-amber-200">
                                <i class="fas fa-scroll"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-stone-800">${section.title}</h3>
                                <p class="text-xs text-stone-500 en-text italic">${section.title_en}</p>
                            </div>
                        </div>

                        <div class="space-y-8">
                            ${section.verses.map(verse => `
                                <div class="verse-card">
                                    <!-- Scripture -->
                                    <div class="p-6 bg-stone-50 border-b border-stone-100 relative">
                                        <span class="absolute top-4 right-4 text-[10px] font-bold text-stone-500 bg-white border border-stone-200 px-2 py-0.5 rounded">${verse.ref}</span>
                                        <p class="text-stone-800 text-lg font-serif mb-3 leading-relaxed relative z-10">
                                            ${verse.text_zh}
                                        </p>
                                        <p class="text-stone-500 text-sm italic en-text pl-3 border-l-2 border-amber-300">
                                            ${verse.text_en}
                                        </p>
                                    </div>
                                    
                                    <!-- Analysis Grid -->
                                    <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-stone-100">
                                        <!-- Meaning -->
                                        <div class="p-6">
                                            <div class="flex items-center mb-3">
                                                <div class="w-6 h-6 rounded bg-stone-100 flex items-center justify-center mr-2 text-stone-500 text-xs"><i class="fas fa-glasses"></i></div>
                                                <h4 class="text-xs font-bold text-stone-500 uppercase tracking-widest">经文含义 Meaning</h4>
                                            </div>
                                            <h5 class="text-sm font-bold text-stone-800 mb-2">${verse.exegesis.title}</h5>
                                            <p class="text-xs sm:text-sm text-stone-600 leading-relaxed text-justify mb-2">${verse.exegesis.content_zh}</p>
                                            <p class="text-[10px] text-stone-400 italic en-text">${verse.exegesis.content_en}</p>
                                        </div>

                                        <!-- Devotional -->
                                        <div class="p-6 bg-amber-50/50">
                                            <div class="flex items-center mb-3">
                                                <div class="w-6 h-6 rounded bg-amber-100 flex items-center justify-center mr-2 text-amber-600 text-xs"><i class="fas fa-heart"></i></div>
                                                <h4 class="text-xs font-bold text-amber-600 uppercase tracking-widest">灵修应用 Devotional</h4>
                                            </div>
                                            <h5 class="text-sm font-bold text-amber-800 mb-2">${verse.devotional.title}</h5>
                                            <p class="text-xs sm:text-sm text-stone-700 leading-relaxed text-justify mb-2">${verse.devotional.content_zh}</p>
                                            <p class="text-[10px] text-amber-800/60 italic en-text">${verse.devotional.content_en}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function renderMethodology() {
            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="max-w-4xl mx-auto fade-in">
                    <div class="text-center mb-10">
                        <h2 class="text-2xl font-bold text-stone-800 serif">解经与灵修的整合</h2>
                        <p class="text-xs text-stone-500 en-text uppercase tracking-widest">Integrating Exegesis & Application</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Principle 1 -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-stone-500">
                            <div class="mb-4 text-stone-600 text-2xl"><i class="fas fa-hourglass-half"></i></div>
                            <h3 class="font-bold text-stone-800 mb-2">末世论张力 (Eschatological Tension)</h3>
                            <p class="text-sm text-stone-600 mb-3 text-justify">
                                玛拉基书4章展示了“已然与未然”（Already/Not Yet）的张力。在施洗约翰（伊莱贾）和耶稣的初临中，这预言已部分应验，但其完全的应验（大而可畏之日）仍指向末世。解经时需保持这种双重指向。
                            </p>
                            <div class="bg-stone-50 p-2 rounded text-xs text-stone-500 italic">
                                <strong>Tool:</strong> See the prophecy as a mountain range—peaks of First and Second Coming merge.
                            </div>
                        </div>

                        <!-- Principle 2 -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-amber-600">
                            <div class="mb-4 text-amber-600 text-2xl"><i class="fas fa-users"></i></div>
                            <h3 class="font-bold text-stone-800 mb-2">宏大叙事与微观关系 (Macro to Micro)</h3>
                            <p class="text-sm text-stone-600 mb-3 text-justify">
                                令人惊讶的是，旧约宏大的救赎历史结束于微观的“父子关系”。这提供了一个极佳的灵修原则：**最伟大的神学最终必须在最亲密的关系中落实**。不要只谈论“改变世界”，先从“转向家人”开始。
                            </p>
                            <div class="bg-amber-50 p-2 rounded text-xs text-amber-800 italic">
                                <strong>Insight:</strong> Global revival starts at the breakfast table.
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
    <script src="../../Assets/js/chapter-settings.js"></script>
</body>
