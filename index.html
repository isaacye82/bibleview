<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>圣经纵览 - BibleView</title>
    <style>
        :root {
            /* === 全局配色 (更加深邃，突出层次) === */
            --bg-color: #dae0e7; 
            --bg-pattern: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            
            --text-main: #2d3748;
            --text-light: #718096;
            --text-white: #ffffff;
            
            --header-bg: rgba(255, 255, 255, 0.85); 
            --header-border: rgba(255, 255, 255, 0.3);
            
            --card-bg: #ffffff;
            --card-border: rgba(255, 255, 255, 0.6);
            
            /* 品牌色 */
            --primary-color: #4facfe;
            --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --primary-light: rgba(79, 172, 254, 0.1);
            
            /* 阴影系统 */
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-active: 0 0 0 3px rgba(79, 172, 254, 0.3);
            
            --radius-box: 20px;
            --radius-btn: 8px;
            
            --chapter-bg: #f1f5f9;
            --chapter-exists-bg: #4facfe;
            --chapter-exists-text: #ffffff;
        }

        body.dark-mode {
            /* 深色模式 */
            --bg-color: #0f1115;
            --bg-pattern: none;
            --text-main: #f7fafc;
            --text-light: #a0aec0;
            --text-white: #ffffff;
            
            --header-bg: rgba(15, 17, 21, 0.85);
            --header-border: #2d3748;
            --card-bg: #1e222b;
            --card-border: #2d3748;
            
            --primary-color: #63b3ed;
            --primary-gradient: linear-gradient(135deg, #63b3ed 0%, #4299e1 100%);
            
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 10px 15px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 20px 25px rgba(0, 0, 0, 0.6);
            
            --chapter-bg: #2d3748;
            --chapter-exists-bg: #63b3ed;
            --chapter-exists-text: #1a202c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", -apple-system, sans-serif;
            font-weight: 300;
            background-color: var(--bg-color); 
            background-image: var(--bg-pattern);
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            transition: background 0.4s ease, color 0.3s ease;
        }

        /* === 顶部导航 === */
        header { 
            background: var(--header-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0 20px;
            padding-top: env(safe-area-inset-top); 
            border-bottom: 1px solid var(--header-border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 150px;
            transition: all 0.3s ease;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .header-title { 
            font-size: 1.5rem; 
            font-weight: 800; 
            letter-spacing: 0.5px; 
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; 
        }
        
        .header-subtitle { 
            font-size: 0.7rem; 
            color: var(--text-light);
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* === Hero Banner (经文卡片) === */
        .hero-section {
            width: 100%;
            max-width: 1100px;
            margin: 24px auto 0;
            padding: 0 20px;
        }

        .hero-card {
            width: 100%;
            height: 180px;
            border-radius: var(--radius-box);
            background-image: url('Config/starrysky.jpg');
            background-size: cover;
            background-position: center 30%;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.7) 100%);
            z-index: 1;
        }

        .hero-text {
            position: relative;
            z-index: 2;
            color: #fff;
            text-align: center;
            padding: 20px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transform: translateY(0);
            transition: transform 0.5s ease;
        }
        
        .hero-card:hover .hero-text { transform: translateY(-2px); }

        .hero-verse {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 10px;
            letter-spacing: 1px;
            font-family: "Songti SC", "SimSun", serif;
            line-height: 1.4;
        }
        .hero-ref {
            font-size: 0.9rem;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* === 主题切换按钮 === */
        .theme-toggle {
            position: absolute;
            right: 20px;
            top: calc(50% + (env(safe-area-inset-top) / 2)); 
            transform: translateY(-50%);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        .theme-toggle:hover { 
            color: var(--primary-color); 
            transform: translateY(-50%) scale(1.05);
            box-shadow: var(--shadow-md);
        }

        /* === 主内容区 === */
        .container { 
            width: 100%;
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            flex: 1; 
        }

        .testament-section { margin-bottom: 40px; }
        
        /* === 标题栏 (图片化设计) === */
        .section-header { 
            display: flex; 
            align-items: center; 
            cursor: pointer; 
            margin-bottom: 24px; 
            padding: 24px 30px;
            border-radius: var(--radius-box);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255,255,255,0.1);
            user-select: none;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            height: 120px; 
            color: #ffffff;
        }

        .section-header-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.6s ease;
            z-index: 0;
        }
        
        .section-header:hover .section-header-bg { transform: scale(1.05); }

        /* 旧约图片 */
        #ot-header .section-header-bg {
            background-image: url('Config/oldbooks.jpg'); 
        }
        /* 新约图片 */
        #nt-header .section-header-bg {
            background-image: url('Config/sunrise.jpg'); 
        }
        /* === 新增：各类主题图片 (使用网络图作为默认，可改为 Config/topics.jpg) === */
        #topics-header .section-header-bg {
            background-image: url('Config/topics.jpg');
        }

        .section-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0.1) 100%);
            z-index: 1;
        }

        .section-content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            width: 100%;
        }
        
        .section-header:hover { 
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .section-header:active { transform: scale(0.98); }
        
        .section-icon {
            width: 36px;
            height: 36px;
            margin-right: 20px;
            fill: none;
            stroke: #ffffff; 
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .section-title { 
            font-size: 1.5rem; 
            font-weight: 700; 
            color: #ffffff;
            margin-right: auto;
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .section-title span { 
            font-weight: 400; 
            font-size: 0.9rem; 
            opacity: 0.9;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        
        .toggle-arrow { 
            width: 28px;
            height: 28px;
            color: #ffffff; 
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            padding: 5px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        .testament-section.collapsed .toggle-arrow { transform: rotate(-90deg); }
        
        /* === 书卷网格 === */
        .books-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 16px; 
            transition: all 0.5s ease;
            max-height: 10000px;
            opacity: 1;
            overflow: visible;
            padding: 0 5px; 
        }

        .testament-section.collapsed .books-grid { 
            max-height: 0; 
            opacity: 0; 
            margin: 0;
            overflow: hidden;
            padding: 0;
        }

        /* === 书卷卡片 === */
        .book-card {
            background: var(--card-bg);
            border-radius: var(--radius-box);
            box-shadow: var(--shadow-sm);
            padding: 20px 15px;
            cursor: pointer;
            border: 1px solid var(--card-border);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .book-card:hover { 
            transform: translateY(-6px); 
            box-shadow: var(--shadow-hover); 
            border-color: rgba(79, 172, 254, 0.3);
            z-index: 2;
        }
        
        .book-card.active {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-active);
            background: var(--card-bg); 
            z-index: 10;
        }

        .book-card.no-chapters { 
            opacity: 0.5; 
            filter: grayscale(1); 
            cursor: default; 
            border-style: dashed;
            background: transparent;
        }

        .book-header-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .book-name { 
            font-size: 1.25rem; 
            font-weight: 600; 
            color: var(--text-main);
            margin-bottom: 6px;
        }
        
        .book-abbr { 
            font-size: 0.75rem; 
            color: var(--primary-color); 
            background: var(--primary-light);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-expand-icon {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            color: var(--text-light);
            opacity: 0.3;
            transition: transform 0.3s ease, color 0.3s;
        }
        .book-card:hover .card-expand-icon { opacity: 1; color: var(--primary-color); }
        .book-card.active .card-expand-icon { transform: rotate(180deg); color: var(--primary-color); }

        /* === 章节容器 === */
        .chapters-container {
            margin-top: 16px;
            width: 100%;
            display: none; 
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding-top: 16px;
            border-top: 1px dashed var(--card-border);
            animation: slideDown 0.3s cubic-bezier(0.2, 0, 0.2, 1);
        }

        /* === 新增：自定义主题卡片的特殊样式 === */
        /* 强制主题卡片中的链接列表为单列，且文字左对齐，适应长标题 */
        .topic-card .chapters-container {
            grid-template-columns: 1fr; /* 改为单列 */
            gap: 10px;
        }
        .topic-card .chapter-link {
            justify-content: flex-start; /* 左对齐 */
            padding-left: 15px;
            width: 100%;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .book-card.active .chapters-container { display: grid; }

        .chapter-link {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 38px;
            background: var(--chapter-bg);
            color: var(--text-light);
            text-decoration: none;
            border-radius: var(--radius-btn);
            font-size: 0.9rem;
            transition: all 0.2s;
            font-family: "SF Mono", "Roboto Mono", monospace;
        }

        .chapter-link:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .chapter-link.exists {
            background: var(--chapter-exists-bg);
            color: var(--chapter-exists-text);
            font-weight: 600;
            box-shadow: 0 2px 4px rgba(79, 172, 254, 0.2);
        }
        
        .chapter-link.exists:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(79, 172, 254, 0.3);
        }
        .chapter-link.exists:active { transform: scale(0.95); }

        /* === 页脚 === */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            font-size: 0.85rem;
            border-top: 1px solid var(--card-border);
            background: var(--card-bg);
            margin-top: 20px;
        }
        footer a { color: var(--primary-color); text-decoration: none; border-bottom: 1px dotted transparent; transition: all 0.2s; }
        footer a:hover { opacity: 0.8; border-bottom-color: var(--primary-color); }

        /* ====== 移动端适配 (布局核心调整) ====== */
        @media (max-width: 600px) {
            header { 
                padding: 0 15px; 
                padding-top: env(safe-area-inset-top); 
                height: calc(60px + env(safe-area-inset-top)); 
            }
            .theme-toggle { 
                width: 32px; height: 32px; font-size: 1rem; right: 15px; 
                top: calc(50% + (env(safe-area-inset-top) / 2));
            }
            
            .header-title { font-size: 1.3rem; }
            .header-subtitle { font-size: 0.65rem; }
            
            .hero-section { margin: 10px auto 0; padding: 0 15px; }
            .hero-card { height: 130px; border-radius: 12px; } 
            .hero-verse { font-size: 1.05rem; margin-bottom: 6px; }
            .hero-ref { font-size: 0.8rem; }

            .container { padding: 15px 15px; }
            .testament-section { margin-bottom: 12px; } 
            
            .section-header { 
                padding: 15px; 
                height: 85px; 
                border-radius: 12px; 
                margin-bottom: 0; 
            }
            .testament-section:not(.collapsed) .section-header { margin-bottom: 15px; }

            .section-icon { width: 28px; height: 28px; margin-right: 12px; }
            .section-title { font-size: 1.2rem; }
            .section-title span { font-size: 0.75rem; }
            
            .books-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .book-card { padding: 12px 6px; border-radius: 12px; }
            .book-name { font-size: 0.95rem; }
            .book-abbr { font-size: 0.65rem; padding: 2px 6px; }
            .chapters-container { gap: 6px; }
            .chapter-link { height: 34px; font-size: 0.8rem; border-radius: 6px; }

            /* 移动端 Topic Card 适配 */
            .topic-card .book-name { font-size: 1rem; }
            .topic-card .chapter-link { font-size: 0.8rem; padding-left: 10px; height: auto; padding-top: 8px; padding-bottom: 8px;}

            footer {
                padding: 20px 10px;
                margin-top: 10px;
            }
        }
        
        @media (max-width: 380px) {
            .books-grid { grid-template-columns: repeat(2, 1fr); }
            .chapters-container { grid-template-columns: repeat(4, 1fr); }
            /* 窄屏下 Topic Card 仍保持单列 */
            .topic-card .chapters-container { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" href="Assets/css/home-modern.css">
</head>
<body class="dark-mode">

    <header>
        <div class="header-content">
            </br><h1 class="header-title">圣经纵览｜BibleView</h1>
            <p class="header-subtitle">横屏观看效果更佳</p>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
            <span id="theme-icon">🌙</span>
        </button>

    <div class="hero-section">
        <div class="hero-card">
            <div class="hero-overlay"></div>
            <div class="hero-text">
                <div class="hero-verse">你的话是我脚前的灯，是我路上的光.</div>
                <div class="hero-verse">Your word is a lamp to my feet and a light to my path.</div>
                <div class="hero-ref">诗篇 119:105</div>

    <div class="container">
        <div class="testament-section collapsed" id="ot-section">
            <div class="section-header" id="ot-header" onclick="toggleSection('ot-section')">
                <div class="section-header-bg"></div>
                <div class="section-overlay"></div>
                <div class="section-content-wrapper">
                    <svg class="section-icon" viewBox="0 0 24 24">

                    </svg>
                    <div class="section-title">旧约 <span>Old Testament</span></div>

        <div class="testament-section collapsed" id="nt-section">

                    </svg>
                </div>
            </div>
            <div class="books-grid" id="nt-books"></div>
        </div>

        <div class="testament-section collapsed" id="topics-section">
            <div class="section-header" id="topics-header" onclick="toggleSection('topics-section')">
                <div class="section-header-bg"></div>
                <div class="section-overlay"></div>
                <div class="section-content-wrapper">
                    <svg class="section-icon" viewBox="0 0 24 24">
                        <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    <div class="section-title">各类主题 <span>Various Topics</span></div>
                    <svg class="toggle-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </div>
            </div>
            <div class="books-grid" id="topics-books"></div>
        </div>

    </div>

    <footer>
        <p>© 2025 圣经纵览 BibleView | 内容仅供学习参考</p>
        <p style="margin-top: 10px;">
            <a href="Config/disclaimer.html">免责声明</a> &bull; 
            <a href="Config/Guestbook.html">留言板</a>
        </p>
        <p style="margin-top: 8px; font-size: 0.7rem; opacity: 0.6;">本站总访问量PV: <span id="busuanzi_value_site_pv">—</span></p>
    </footer>

    <script>
        // ========== 配置数据 (圣经章节) ==========
        const availableChapters = {
            
            // 摩西五经
            "Gen":   Array.from({ length: 13 }, (_, i) => i + 1), // 创世记 50

            "Song":  Array.from({ length: 8 },  (_, i) => i + 1), // 雅歌 8
            
            // 历史书
            "Josh":  Array.from({ length: 24 }, (_, i) => i + 1), 

            // 小先知书

        function toggleTheme() {

            icon.textContent = document.body.classList.contains('dark-mode') ? '🌙' : '☀';
        }

            document.getElementById(id).classList.toggle('collapsed');

        // 创建圣经书卷卡片 (旧逻辑)
        function createBookCard(book, type) {
            const existingChapters = availableChapters[book.abbr] || [];
            const hasChapters = existingChapters.length > 0;
            const pathPrefix = type === 'OT' ? 'OT' : 'NT';

            const card = document.createElement('div');
            card.className = `book-card ${hasChapters ? '' : 'no-chapters'}`;
            
            const chapterLinks = Array.from({ length: book.chapters }, (_, i) => {
                const chNum = i + 1;
                const exists = existingChapters.includes(chNum);
                const url = `${pathPrefix}/${book.abbr}/${book.abbr}${chNum}.html`;
                
                return `<a href="${url}" class="chapter-link ${exists ? 'exists' : ''}" data-exists="${exists}">${chNum}</a>`;
            }).join('');

            const chevronSvg = `
                <svg class="card-expand-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            `;

            card.innerHTML = `
                <div class="book-header-content">
                    <div class="book-name">${book.short} ${book.abbr}</div>
                    <div class="book-abbr">${book.english}</div>
                    ${hasChapters ? chevronSvg : ''}
                </div>
                <div class="chapters-container">
                    ${chapterLinks}
                </div>
            `;

            if (hasChapters) {
                card.addEventListener('click', (e) => {
                    if(e.target.tagName === 'A' || e.target.closest('a')) return;
                    card.classList.toggle('active');
                });
            }

            card.querySelectorAll('.chapter-link').forEach(link => {
                if (link.getAttribute('data-exists') === 'false') {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                    });
                }
            });

            return card;
        }

        // 新增：创建主题卡片 (逻辑类似，但适配自定义链接)
        function createTopicCard(topic) {
            const hasLinks = topic.links && topic.links.length > 0;
            
            const card = document.createElement('div');
            // 增加 topic-card 类以应用特殊样式(单列布局)
            card.className = `book-card topic-card ${hasLinks ? '' : 'no-chapters'}`;
            
            const linksHtml = topic.links.map(link => {
                return `<a href="${link.url}" class="chapter-link exists">${link.name}</a>`;
            }).join('');

            const chevronSvg = `
                <svg class="card-expand-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            `;

            card.innerHTML = `
                <div class="book-header-content">
                    <div class="book-name">${topic.title}</div>
                    <div class="book-abbr">${topic.abbr} <span style="font-weight:300; opacity:0.7">| ${topic.desc}</span></div>
                    ${hasLinks ? chevronSvg : ''}
                </div>
                <div class="chapters-container">
                    ${linksHtml}
                </div>
            `;

            if (hasLinks) {
                card.addEventListener('click', (e) => {
                    if(e.target.tagName === 'A' || e.target.closest('a')) return;
                    card.classList.toggle('active');
                });
            }

            return card;
        }

        function renderAll() {
            const otContainer = document.getElementById('ot-books');
            const ntContainer = document.getElementById('nt-books');
            const topicsContainer = document.getElementById('topics-books');
            
            otContainer.innerHTML = '';

            topicsContainer.innerHTML = '';
            
            bibleBooks.oldTestament.forEach(book => {
                otContainer.appendChild(createBookCard(book, 'OT'));
            });
            
            bibleBooks.newTestament.forEach(book => {
                ntContainer.appendChild(createBookCard(book, 'NT'));
            });

            topicCategories.forEach(topic => {
                topicsContainer.appendChild(createTopicCard(topic));
            });
        }
