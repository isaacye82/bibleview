            margin-left: auto;
            margin-right: auto;
            height: 320px;
            max-height: 400px;

        /* Navigation Styling */

            color: #4D7C0F; /* Lime 700 */
            font-weight: 700;
        }
        .active-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #4D7C0F;
            border-radius: 2px;
        }

        /* Interactive Card Styling */
        .verse-card {
            border-left: 4px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #FFFFFF;

        /* Hover effect shifts to Grace Crimson */

            border-left-color: #E11D48; /* Rose 600 */
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(225, 29, 72, 0.1), 0 4px 6px -2px rgba(225, 29, 72, 0.05);

        .greek-chip {
            background-color: #ECFCCB; /* Lime 100 */
            color: #365314; /* Lime 800 */
            font-family: 'Times New Roman', serif;
            font-style: italic;

            border-radius: 4px;
            font-size: 0.85em;
            border: 1px solid #BEF264; /* Lime 300 */
            display: inline-block;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        /* Dual-tone gradient backgrounds */
        .gradient-romans5 {
            background: linear-gradient(135deg, #1A2E05 0%, #E11D48 100%);
            color: white;
        }

        /* Animation */
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

</head>

        // --- Navigation Logic ---

            // Update Tab Styling

                btn.classList.remove('active-tab');
                btn.classList.add('text-slate-500');
            });
            document.getElementById(`nav-${view}`).classList.add('active-tab');
            document.getElementById(`nav-${view}`).classList.remove('text-slate-500');

            // Render Views
            const container = document.getElementById('app-content');
            container.innerHTML = '';
            
            if (view === 'dashboard') renderDashboard();
            if (view === 'study') renderStudy();
            if (view === 'methodology') renderMethodology();
            
            window.scrollTo(0,0);

                        <div class="p-5 bg-gradient-to-r from-white to-lime-50 border-b border-lime-100">
                            <span class="inline-block px-2 py-1 bg-lime-100 text-lime-800 text-xs font-bold rounded mb-2 font-mono">${verse.ref}</span>
                            <p class="text-stone-800 font-serif text-lg leading-relaxed italic">"${verse.text}"</p>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-lime-100">
                            <!-- Academic -->
                            <div class="p-6 ${appState.studyFilter === 'devotional' ? 'hidden' : ''} hover:bg-rose-50/20 transition">
                                <h4 class="text-rose-800 font-bold text-xs uppercase tracking-widest mb-3 flex items-center">
                                    <i class="fas fa-university mr-2"></i> 权威/学术性解经
                                </h4>
                                <div class="mb-3">
                                    ${verse.academic.keywords.map(kw => `<span class="greek-chip">${kw}</span>`).join('')}
                                </div>
                                <h5 class="font-bold text-lime-900 mb-2">${verse.academic.title}</h5>
                                <p class="text-stone-600 text-sm leading-relaxed text-justify">${verse.academic.content}</p>
                            </div>

                            <!-- Devotional -->
                            <div class="p-6 ${appState.studyFilter === 'academic' ? 'hidden' : ''} hover:bg-slate-50/20 transition">
                                <h4 class="text-slate-700 font-bold text-xs uppercase tracking-widest mb-3 flex items-center">
                                    <i class="fas fa-heart mr-2"></i> 灵修/个人应用
                                </h4>
                                <h5 class="font-bold text-lime-900 mb-2">${verse.devotional.title}</h5>
                                <p class="text-stone-600 text-sm leading-relaxed text-justify">${verse.devotional.content}</p>
                            </div>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="mb-12 max-w-5xl mx-auto">
                        <div class="flex items-center mb-6 border-b-2 ${titleColorClass} pb-2">
                            <h3 class="text-2xl font-bold ${titleColorClass.split(' ')[0]}">${section.title}</h3>
                        </div>
                        ${versesHtml}
                    </div>
                `;
            }).join('');

            container.innerHTML = filterControls + contentHtml;
        }

        function updateStudyFilter(filter) {
            appState.studyFilter = filter;
            renderStudy();
        }

        function renderMethodology() {
            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="max-w-4xl mx-auto animate-fade-in">
                    <div class="text-center mb-10">
                        <h2 class="text-3xl font-bold mb-4 serif text-lime-900">解经原则：类型学与论证</h2>
                        <p class="text-stone-600">
                            罗马书第五章展示了如何通过宏大的历史类型学（Typology）和严密的逻辑论证（Argumentation）来确立救恩的确据。
                        </p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Exegetical/Academic -->
                        <div class="bg-white p-8 rounded-xl shadow-lg border-t-4 border-rose-600">
                            <div class="text-rose-600 text-4xl mb-4"><i class="fas fa-search"></i></div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">权威和学术性解经 (Exegetical)</h3>
                            <p class="text-sm text-stone-500 mb-4 uppercase tracking-wide">关注：结构与代表性</p>
                            <ul class="space-y-4 text-stone-600 text-sm">
                                <li><strong>原则：</strong> 联邦神学/代表性原则。理解亚当和基督作为全人类两大元首的法理地位。</li>
                                <li><strong>方法：</strong> 
                                    <br>1. 从大推小逻辑（"何况...岂不更..."）。
                                    <br>2. 比较级修辞（恩典如何"超级"胜过罪）。
                                </li>
                                <li><strong>目的：</strong> 证明救恩的客观性、历史性和超越性。</li>
                            </ul>
                        </div>

                        <!-- Devotional/Application -->
                        <div class="bg-white p-8 rounded-xl shadow-lg border-t-4 border-lime-500">
                            <div class="text-lime-500 text-4xl mb-4"><i class="fas fa-praying-hands"></i></div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">灵修性解经与应用 (Devotional)</h3>
                            <p class="text-sm text-stone-500 mb-4 uppercase tracking-wide">关注：身份与确据</p>
                            <ul class="space-y-4 text-stone-600 text-sm">
                                <li><strong>原则：</strong> 身份重置。将信徒的自我认知从"在亚当里"转移到"在基督里"。</li>
                                <li><strong>方法：</strong> 
                                    <br>1. 苦难转化（将患难视为生产盼望的工具）。
                                    <br>2. 确据建立（基于神在过去的历史行动，而非当下的感觉）。
                                </li>
                                <li><strong>目的：</strong> 在恩典中站立得稳，并欢欢喜喜地盼望荣耀。</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Chart Initialization ---

        function initCharts() {
            // Adam vs Christ Chart (Bar - Horizontal)
            const ctxAdamChrist = document.getElementById('adamChristChart').getContext('2d');
            new Chart(ctxAdamChrist, {
                type: 'bar',
                data: {
                    labels: ['行为性质', '影响范围', '最终结果', '统治力量'],
                    datasets: [
                        {
                            label: '亚当 (一人悖逆)',
                            data: [-50, -80, -90, -70], // Negative Impact
                            backgroundColor: '#94A3B8', // Slate
                            borderRadius: 4
                        },
                        {
                            label: '基督 (一人顺服)',
                            data: [100, 100, 100, 100], // Positive Impact (Much More)
                            backgroundColor: '#E11D48', // Rose (Grace)
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { 
                            grid: { display: false },
                            ticks: { display: false } 
                        },
                        y: { grid: { display: false } }
                    },
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (context.dataset.label.includes('亚当')) {
                                        if (context.dataIndex === 0) return "过犯";
                                        if (context.dataIndex === 1) return "众人成为罪人";
                                        if (context.dataIndex === 2) return "定罪/死亡";
                                        if (context.dataIndex === 3) return "死作王";
                                    } else {
                                        if (context.dataIndex === 0) return "恩赐/顺服";
                                        if (context.dataIndex === 1) return "众人成为义人";
                                        if (context.dataIndex === 2) return "称义/得生命";
                                        if (context.dataIndex === 3) return "生命作王";
                                    }
                                }
                            }
                        }
                    }
                }
            });

            // Much More Logic Funnel (Doughnut)
            const ctxMuchMore = document.getElementById('muchMoreChart').getContext('2d');
            new Chart(ctxMuchMore, {
                type: 'doughnut',
                data: {
                    labels: ['已完成 (死/称义/作仇敌时)', '更确定 (生/得救/作儿女时)'],
                    datasets: [{
                        data: [40, 60], // Logic: If A(40) happened, B(60) is guaranteed
                        backgroundColor: [
                            '#FCD34D', // Amber (Initial Grace)
                            '#4D7C0F'  // Lime (Saving Life)
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label;
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
    <script src="../../Assets/js/chapter-settings.js"></script>
</body>
</html>
