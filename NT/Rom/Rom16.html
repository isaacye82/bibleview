<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罗马书第十六章：问安、警戒与颂赞</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        /* Theme: Fellowship Gold (Greetings) & Mystery Purple (Doxology) */
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #FFFBEB; /* Amber 50 - Warm, welcoming background */
            color: #451A03; /* Amber 950 */
        }

        h1, h2, h3, .serif {
            font-family: 'Noto Serif SC', serif;
        }

        /* Chart Container Styling */
        .chart-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 320px;
            max-height: 400px;
        }
        
        @media (min-width: 768px) {
            .chart-wrapper {
                height: 380px;
            }
        }

        /* Navigation Styling */
        .nav-btn {
            transition: all 0.3s ease;
            position: relative;
        }
        
        /* Active Tab - Fellowship Gold */
        .active-tab {
            color: #B45309; /* Amber 700 */
            font-weight: 700;
        }
        .active-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #B45309;
            border-radius: 2px;
        }

        /* Interactive Card Styling */
        .verse-card {
            border-left: 4px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #FFFFFF;
        }
        /* Hover effect shifts to Mystery Purple */
        .verse-card:hover {
            border-left-color: #7E22CE; /* Purple 700 */
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(126, 34, 206, 0.1), 0 4px 6px -2px rgba(126, 34, 206, 0.05);
        }

        /* Greek Word Chip */
        .greek-chip {
            background-color: #FEF3C7; /* Amber 100 */
            color: #92400E; /* Amber 800 */
            font-family: 'Times New Roman', serif;
            font-style: italic;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            border: 1px solid #FCD34D; /* Amber 300 */
            display: inline-block;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        /* Dual-tone gradient backgrounds */
        .gradient-romans16 {
            background: linear-gradient(135deg, #B45309 0%, #6B21A8 100%);
            color: white;
        }

        /* Animation */
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-amber-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-amber-900 serif">
                        <i class="fas fa-scroll mr-2 text-purple-600"></i> 罗马书 16章
                    </span>
                </div>
                <div class="flex space-x-6 items-center">
                    <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn active-tab px-2 py-2 text-sm">问安与颂赞</button>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

    </main>

    <!-- Footer -->

    <!-- JavaScript Application Logic -->
    <script>

                            }

                                content: "百基拉和亚居拉是保罗最重要的同工之一（徒18）。值得注意的是，妻子百基拉的名字常排在丈夫前面，可能暗示她在事奉中更活跃或社会地位更高。“将颈项置之度外”指他们曾冒死救保罗。他们也是“家庭教会”的领袖，展示了早期教会分散化、以家庭为单位的组织形式。"
                            },
                            devotional: {
                                title: "开放家庭",
                                content: "这对夫妇走到哪里（罗马、哥林多、以弗所），就把家打开成为教会。你的家是否也是一个属灵的据点？在这个冷漠的城市里，开放的家庭就是福音的暖房。愿我们都能成为像他们一样“为福音拼命”且“乐意接待”的同工。"
                            }
                        }
                    ]
                },
                {
                    id: "warning",
                    title: "最后的警报：防备分裂 (16:17-20)",
                    themeColor: "red",
                    verses: [
                        {
                            ref: "16:17-18",
                            text: "那些离间你们、叫你们跌倒、背乎所学之道的人，我劝你们要留意躲避他们...他们不服侍...基督，只服侍自己的肚腹。",
                            academic: {
                                title: "对假教师的侧写",
                                keywords: ["Dichostasias (离间/分裂)", "Koilian (肚腹)", "Chrēstologias (花言巧语)"],
                                content: "在长长的问安名单后，保罗突然插入这个警告，表明他对罗马教会合一的高度关注。分裂者（Divisive people）的特征是：1. 违背使徒教训；2. 动机不纯（服侍肚腹=贪财或私欲）；3. 手段欺骗（花言巧语）。对策是：留意（Skopein，像哨兵一样盯着）并躲避（Ekklinete，偏离/避开）。"
                            },
                            devotional: {
                                title: "虽然爱，但有界限",
                                content: "爱心不等于没有原则的包容。对于那些在教会中制造纷争、传播异端的人，保罗的建议不是“多沟通”，而是“躲避”。保护羊群免受狼的侵害，是牧者最大的爱心。我们要有分辨的智慧（对善聪明），也要有拒绝的勇气（对恶愚拙）。"
                            }
                        },
                        {
                            ref: "16:20",
                            text: "赐平安的神快要将撒但践踏在你们脚下。",
                            academic: {
                                title: "原始福音的应验",
                                keywords: ["Syntripsei (践踏/粉碎)", "En Tachei (快要/迅速)"],
                                content: "这是对创世记3:15（原始福音）的回响。神应许女人的后裔（基督）要伤蛇的头。保罗将这一应许应用在教会（基督的身体）身上——神要藉着教会将撒但践踏在脚下。“赐平安的神”通过“粉碎”撒但来带来真正的平安（Shalom）。这是一场终末的属灵战争。"
                            },
                            devotional: {
                                title: "得胜的预告",
                                content: "当你被魔鬼攻击、被环境压迫时，抓住这句应许：神“快要”践踏撒但。虽然现在看起来争战激烈，但结局已定。撒但的头已经被基督打碎，神要把这个得胜的权柄赐给你，让你也能将仇敌践踏在脚下。坚持住，胜利就在转角。"
                            }
                        }
                    ]
                },
                {
                    id: "doxology",
                    title: "荣耀的颂赞：奥秘的显明 (16:25-27)",
                    themeColor: "purple",
                    verses: [
                        {
                            ref: "16:25-27",
                            text: "惟有神能照我所传的福音...坚固你们...这奥秘...如今显明出来...按着永生神的命...指示万国的民，使他们信服真道。",
                            academic: {
                                title: "福音的宇宙性维度",
                                keywords: ["Mystērion (奥秘)", "Apokalypsin (启示/显明)", "Hypakoēn Pisteōs (信服真道/信心的顺服)"],
                                content: "这首颂歌是罗马书完美的句号。它概括了全书的核心：1. **能力**：神能坚固（Stērixai）；2. **内容**：我的福音 = 耶稣基督 = 隐藏的奥秘；3. **范围**：从永古隐藏 -> 如今显明（通过先知书和使徒宣讲） -> 指示万国（普世性）；4. **目的**：使人信服真道（Obedience of Faith，首尾呼应1:5）。一切最终归于“独一全智的神”。"
                            },
                            devotional: {
                                title: "你是奥秘的知情者",
                                content: "你手中的圣经，包含了宇宙最大的秘密——神如何拯救罪人并将万国纳入祂的家。这个秘密曾被隐藏了千古，连天使都想查看，如今却向你显明了。拥有这个奥秘的人，是何等有福！我们的回应只能是：将荣耀归给那位全智的神，直到永远。"
                            }
                        }
                    ]
                }
            ]
        };

        // --- State Management ---
        let appState = {
            view: 'dashboard',
            studyFilter: 'all' // all, academic, devotional
        };

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
        });

        // --- Navigation Logic ---
        function navigate(view) {
            appState.view = view;
            
            // Update Tab Styling
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active-tab');
                btn.classList.add('text-slate-500');
            });
            document.getElementById(`nav-${view}`).classList.add('active-tab');
            document.getElementById(`nav-${view}`).classList.remove('text-slate-500');

            // Render Views
            const container = document.getElementById('app-content');
            container.innerHTML = '';
            
            if (view === 'dashboard') renderDashboard();
            if (view === 'study') renderStudy();
            if (view === 'methodology') renderMethodology();
            
            window.scrollTo(0,0);
        }

        // --- Render Functions ---

        function renderDashboard() {
            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 animate-fade-in">

        function renderStudy() {
            const container = document.getElementById('app-content');
            
            // Sticky Filters
            const filterControls = `
                <div class="sticky top-16 z-40 bg-[#FFFBEB]/95 backdrop-blur py-4 mb-8 border-b border-amber-200">
                    <div class="flex justify-between items-center max-w-5xl mx-auto">

                        <div class="flex bg-white rounded-lg shadow-sm p-1 border border-amber-200">

                    </div>
                </div>
            `;

            // Content
            const contentHtml = chapterData.sections.map(section => {
                let titleColorClass = '';
                if(section.themeColor === 'amber') titleColorClass = 'text-amber-800 border-amber-200';
                else if(section.themeColor === 'red') titleColorClass = 'text-red-800 border-red-200';
                else titleColorClass = 'text-purple-800 border-purple-200';
                
                const versesHtml = section.verses.map(verse => `
                    <div class="verse-card rounded-xl shadow-sm mb-8 overflow-hidden border border-amber-100">
                        <div class="p-5 bg-gradient-to-r from-white to-amber-50 border-b border-amber-100">

                            <p class="text-slate-800 font-serif text-lg leading-relaxed italic">"${verse.text}"</p>

                        <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-amber-100">

                            <div class="p-6 ${appState.studyFilter === 'devotional' ? 'hidden' : ''} hover:bg-purple-50/30 transition">

                                </div>
                                <h5 class="font-bold text-amber-900 mb-2">${verse.academic.title}</h5>
                                <p class="text-slate-700 text-sm leading-relaxed text-justify">${verse.academic.content}</p>
                            </div>

                            <!-- Devotional -->
                            <div class="p-6 ${appState.studyFilter === 'academic' ? 'hidden' : ''} hover:bg-slate-50/30 transition">
                                <h4 class="text-slate-700 font-bold text-xs uppercase tracking-widest mb-3 flex items-center">
                                    <i class="fas fa-heart mr-2"></i> 灵修/个人应用
                                </h4>
                                <h5 class="font-bold text-amber-900 mb-2">${verse.devotional.title}</h5>
                                <p class="text-slate-700 text-sm leading-relaxed text-justify">${verse.devotional.content}</p>
                            </div>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="mb-12 max-w-5xl mx-auto">
                        <div class="flex items-center mb-6 border-b-2 ${titleColorClass} pb-2">
                            <h3 class="text-2xl font-bold ${titleColorClass.split(' ')[0]}">${section.title}</h3>
                        </div>
                        ${versesHtml}
                    </div>
                `;
            }).join('');

            container.innerHTML = filterControls + contentHtml;
        }

        function updateStudyFilter(filter) {
            appState.studyFilter = filter;
            renderStudy();
        }

        // --- Chart Initialization ---

        function initCharts() {
            // Divider vs Builder Chart (Bar)
            const ctxDivider = document.getElementById('dividerChart').getContext('2d');
            new Chart(ctxDivider, {
                type: 'bar',
                data: {
                    labels: ['动机', '手段', '结果', '对策'],
                    datasets: [
                        {
                            label: '分裂者',
                            data: [-50, -80, -90, -100], // Self-serving, Deception, Division, Avoid
                            backgroundColor: '#94A3B8', // Slate
                            borderRadius: 4
                        },
                        {
                            label: '建造者',
                            data: [100, 80, 90, 100], // Christ-serving, Truth, Unity, Embrace
                            backgroundColor: '#B45309', // Amber
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { 
                            grid: { display: false },
                            ticks: { display: false } 
                        },
                        y: { grid: { display: false } }
                    },
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (context.dataset.label === '分裂者') {
                                        if (context.dataIndex === 0) return "服侍肚腹";
                                        if (context.dataIndex === 1) return "花言巧语";
                                        if (context.dataIndex === 2) return "叫人跌倒";
                                        if (context.dataIndex === 3) return "留意躲避";
                                    } else {
                                        if (context.dataIndex === 0) return "服侍基督";
                                        if (context.dataIndex === 1) return "诚实真理";
                                        if (context.dataIndex === 2) return "建立德行";
                                        if (context.dataIndex === 3) return "彼此接纳";
                                    }
                                    return "";
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
    <script src="../../Assets/js/chapter-settings.js"></script>
