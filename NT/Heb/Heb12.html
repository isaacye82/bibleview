            margin-left: auto;
            margin-right: auto;
            height: 320px;
            max-height: 400px;
        }

            }

        /* Navigation Styling */

            position: relative;
        }
        
        /* Active Tab - Zion Gold */

            color: #B45309; /* Amber 700 */
            font-weight: 700;
        }
        .active-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #B45309;
            border-radius: 2px;
        }

        /* Interactive Card Styling */
        .verse-card {
            border-left: 4px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #FFFFFF;
        }
        /* Hover effect shifts to Endurance Maroon */

            border-left-color: #991B1B; /* Red 800 */
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(153, 27, 27, 0.1), 0 4px 6px -2px rgba(153, 27, 27, 0.05);
        }

        .greek-chip {
            background-color: #FEF2F2; /* Red 50 */
            color: #7F1D1D; /* Red 900 */
            font-family: 'Times New Roman', serif;
            font-style: italic;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            border: 1px solid #FECACA; /* Red 200 */
            display: inline-block;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        /* Dual-tone gradient backgrounds */
        .gradient-endurance {
            background: linear-gradient(135deg, #78350F 0%, #B45309 100%);
            color: white;
        }

        /* Animation */
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

        // --- Navigation Logic ---

            // Update Tab Styling

                btn.classList.remove('active-tab');
                btn.classList.add('text-slate-500');
            });
            document.getElementById(`nav-${view}`).classList.add('active-tab');
            document.getElementById(`nav-${view}`).classList.remove('text-slate-500');

            // Render Views

            container.innerHTML = '';
            
            if (view === 'dashboard') renderDashboard();
            if (view === 'study') renderStudy();
            if (view === 'methodology') renderMethodology();
            
            window.scrollTo(0,0);

                let titleColorClass = '';
                if(section.themeColor === 'red') titleColorClass = 'text-red-800 border-red-200';
                else if(section.themeColor === 'amber') titleColorClass = 'text-amber-800 border-amber-200';
                else if(section.themeColor === 'slate') titleColorClass = 'text-slate-700 border-slate-200';
                else if(section.themeColor === 'orange') titleColorClass = 'text-orange-700 border-orange-200';
                else titleColorClass = 'text-slate-700 border-slate-200';
                
                const versesHtml = section.verses.map(verse => `
                    <div class="verse-card rounded-xl shadow-sm mb-8 overflow-hidden border border-amber-100">
                        <div class="p-5 bg-gradient-to-r from-white to-amber-50 border-b border-amber-100">
                            <span class="inline-block px-2 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded mb-2 font-mono">${verse.ref}</span>
                            <p class="text-slate-800 font-serif text-lg leading-relaxed italic">"${verse.text}"</p>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-amber-100">
                            <!-- Academic -->
                            <div class="p-6 ${appState.studyFilter === 'devotional' ? 'hidden' : ''} hover:bg-red-50/30 transition">
                                <h4 class="text-red-800 font-bold text-xs uppercase tracking-widest mb-3 flex items-center">
                                    <i class="fas fa-university mr-2"></i> 权威/学术性解经
                                </h4>
                                <div class="mb-3">
                                    ${verse.academic.keywords.map(kw => `<span class="greek-chip">${kw}</span>`).join('')}
                                </div>
                                <h5 class="font-bold text-amber-900 mb-2">${verse.academic.title}</h5>
                                <p class="text-slate-700 text-sm leading-relaxed text-justify">${verse.academic.content}</p>
                            </div>

                            <!-- Devotional -->
                            <div class="p-6 ${appState.studyFilter === 'academic' ? 'hidden' : ''} hover:bg-slate-50/30 transition">
                                <h4 class="text-slate-700 font-bold text-xs uppercase tracking-widest mb-3 flex items-center">
                                    <i class="fas fa-heart mr-2"></i> 灵修/个人应用
                                </h4>
                                <h5 class="font-bold text-amber-900 mb-2">${verse.devotional.title}</h5>
                                <p class="text-slate-700 text-sm leading-relaxed text-justify">${verse.devotional.content}</p>
                            </div>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="mb-12 max-w-5xl mx-auto">
                        <div class="flex items-center mb-6 border-b-2 ${titleColorClass} pb-2">
                            <h3 class="text-2xl font-bold ${titleColorClass.split(' ')[0]}">${section.title}</h3>
                        </div>
                        ${versesHtml}
                    </div>
                `;
            }).join('');

            container.innerHTML = filterControls + contentHtml;
        }

        function updateStudyFilter(filter) {
            appState.studyFilter = filter;
            renderStudy();
        }

        function renderMethodology() {
            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="max-w-4xl mx-auto animate-fade-in">
                    <div class="text-center mb-10">
                        <h2 class="text-3xl font-bold mb-4 serif text-amber-900">解经原则：对比与重构</h2>
                        <p class="text-slate-600">
                            希伯来书第12章通过重构对苦难的认知（管教）和对比两个约的场景（两座山），来激励信徒坚持到底。
                        </p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Exegetical/Academic -->
                        <div class="bg-white p-8 rounded-xl shadow-lg border-t-4 border-red-600">
                            <div class="text-red-600 text-4xl mb-4"><i class="fas fa-search"></i></div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">权威和学术性解经 (Exegetical)</h3>
                            <p class="text-sm text-slate-500 mb-4 uppercase tracking-wide">关注：隐喻与神学</p>
                            <ul class="space-y-4 text-slate-600 text-sm">
                                <li><strong>原则：</strong> 隐喻重构。将"苦难"从刑罚的框架移入"家庭管教"的框架，改变读者的认知。</li>
                                <li><strong>方法：</strong> 
                                    <br>1. 场景对比（西奈山的恐怖 vs 锡安山的欢庆）。
                                    <br>2. 竞技场意象（赛跑、见证人、放下重担）。
                                </li>
                                <li><strong>目的：</strong> 消除对苦难的误解，确立新约信徒的优越地位。</li>
                            </ul>
                        </div>

                        <!-- Devotional/Application -->
                        <div class="bg-white p-8 rounded-xl shadow-lg border-t-4 border-amber-500">
                            <div class="text-amber-500 text-4xl mb-4"><i class="fas fa-praying-hands"></i></div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">灵修性解经与应用 (Devotional)</h3>
                            <p class="text-sm text-slate-500 mb-4 uppercase tracking-wide">关注：态度与终点</p>
                            <ul class="space-y-4 text-slate-600 text-sm">
                                <li><strong>原则：</strong> 焦点转移。从关注当下的痛苦（手下垂腿发酸）转移到仰望耶稣和未来的国度。</li>
                                <li><strong>方法：</strong> 
                                    <br>1. 顺服操练（在受苦中学习儿子的顺服）。
                                    <br>2. 感恩回应（既然得了不能震动的国，就当感恩）。
                                </li>
                                <li><strong>目的：</strong> 在震动的世界中，活出不可震动的平安与敬畏。</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Chart Initialization ---

        function initCharts() {
            // Discipline Alchemy Chart (Line/Area)
            const ctxDiscipline = document.getElementById('disciplineChart').getContext('2d');
            new Chart(ctxDiscipline, {
                type: 'line',
                data: {
                    labels: ['开始', '管教中', '经练后', '成熟'],
                    datasets: [
                        {
                            label: '主观感受 (愁苦)',
                            data: [0, 90, 40, 10], // High pain initially
                            borderColor: '#DC2626', // Red
                            backgroundColor: 'rgba(220, 38, 38, 0.1)',
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '属灵果效 (义果)',
                            data: [0, 20, 60, 100], // Growth over time
                            borderColor: '#D97706', // Amber
                            backgroundColor: 'rgba(217, 119, 6, 0.1)',
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { display: false, beginAtZero: true },
                        x: { grid: { display: false } }
                    },
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if(context.dataIndex === 1 && context.datasetIndex === 0) return "当时不觉得快乐";
                                    if(context.dataIndex === 3 && context.datasetIndex === 1) return "结出平安的果子";
                                    return context.formattedValue;
                                }
                            }
                        }
                    }
                }
            });

            // The Race Chart (Doughnut)
            const ctxRace = document.getElementById('raceChart').getContext('2d');
            new Chart(ctxRace, {
                type: 'doughnut',
                data: {
                    labels: ['见证人激励', '放下重担/罪', '忍耐奔跑', '仰望耶稣'],
                    datasets: [{
                        data: [15, 25, 30, 30],
                        backgroundColor: [
                            '#94A3B8', // Slate (Cloud)
                            '#DC2626', // Red (Action)
                            '#F59E0B', // Amber (Endurance)
                            '#450A0A'  // Dark Red (Focus)
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 10 } }
                    }
                }
            });
        }
    </script>
    <script src="../../Assets/js/chapter-settings.js"></script>
</body>
</html>
