        // --- Interactive Canvas Animation Setup (The Refiner's Fire) ---
        let canvas, ctx;
        let particles = [];
        let temperature = 100;
        let animationFrameId;
        let slider;

        function initRefineryCanvas() {
            canvas = document.getElementById('refineCanvas');
            if(!canvas) return;
            ctx = canvas.getContext('2d');

            // Responsive Scaling
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            slider = document.getElementById('fireSlider');
            if(slider) {
                slider.addEventListener('input', (e) => {
                    updateTrialLevel(parseInt(e.target.value));
                });
            }

            // Create initial mix of gold particles and dross (gray dirt particles)
            createRefineryParticles();

            // Run Loop
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            runRefineryLoop();
        }

        function createRefineryParticles() {
            particles = [];
            const count = 70;
            for(let i=0; i<count; i++) {
                // Gold particles are glowing yellow/amber
                // Dross particles are dark grayish brown
                const isGold = Math.random() > 0.45;
                particles.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height * 0.4 + Math.random() * (canvas.height * 0.5),
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2,
                    size: Math.random() * 3 + 1.5,
                    isGold: isGold,
                    brightness: Math.random(),
                    burned: false, // Dross gets burned out (fades out)
                    alpha: 1.0
                });
            }
        }

        function updateTrialLevel(level) {
            const tempDisp = document.getElementById('tempDisplay');
            const drossDisp = document.getElementById('drossDisplay');
            const intensityLabel = document.getElementById('intensityLabel');

            let tempText = "100℃";
            let drossPct = "100%";
            let intensityStr = "微小 (Mild)";

            switch(level) {
                case 1:
                    temperature = 100;
                    tempText = "100℃";
                    drossPct = "100%";
                    intensityStr = "微小 (Mild)";
                    break;
                case 2:
                    temperature = 400;
                    tempText = "400℃";
                    drossPct = "70%";
                    intensityStr = "温和 (Moderate)";
                    break;
                case 3:
                    temperature = 800;
                    tempText = "800℃";
                    drossPct = "40%";
                    intensityStr = "严峻 (Intense)";
                    break;
                case 4:
                    temperature = 1200;
                    tempText = "1200℃";
                    drossPct = "15%";
                    intensityStr = "烈火 (Severe)";
                    break;
                case 5:
                    temperature = 1800;
                    tempText = "1800℃";
                    drossPct = "0%";
                    intensityStr = "熔炉极限 (The Furnace Limit)";
                    break;
            }

            tempDisp.innerText = tempText;
            intensityLabel.innerText = intensityStr;

            // Trigger physical sound or feedback via custom dynamic state modification
            // Burn the non-gold dross according to temp level
            particles.forEach(p => {
                if(!p.isGold) {
                    const threshold = (level - 1) / 4.0; // 0 to 1
                    if(Math.random() < threshold) {
                        p.burned = true;
                    } else {
                        // Undo burning if they slide temp back down
                        p.burned = false;
                        p.alpha = 1.0;
                    }
                }
            });

            // Re-calculate remaining dross percentage realistically
            const drossTotal = particles.filter(p => !p.isGold).length;
            const activeDross = particles.filter(p => !p.isGold && !p.burned && p.alpha > 0.01).length;
            const actualDrossPct = drossTotal > 0 ? Math.round((activeDross/drossTotal) * 100) : 0;
            drossDisp.innerText = `${actualDrossPct}%`;

            if(level === 5) {
                showToast("试炼达到最高强度！杂质完全烧尽，真金显出尊贵光芒！", "fa-fire-burner");
            }
        }

        function resetRefinery() {
            if(slider) slider.value = 1;
            updateTrialLevel(1);
            createRefineryParticles();
            showToast("冶炼过程已重置！", "fa-undo");
        }

        function runRefineryLoop() {
            if(!canvas || !ctx) return;
            
            // Clear Frame with transparent velvet black
            ctx.fillStyle = 'rgba(11, 15, 26, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw heat waves background (The Fire)
            const gradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height * 0.3);
            const intensityRatio = (temperature - 100) / 1700.0; // 0 to 1
            
            gradient.addColorStop(0, `rgba(${150 + (105 * intensityRatio)}, ${40 * (1-intensityRatio)}, 20, ${0.15 + (0.55 * intensityRatio)})`);
            gradient.addColorStop(0.5, `rgba(180, 80, 10, ${0.05 + (0.3 * intensityRatio)})`);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & Draw particles
            particles.forEach(p => {
                // physics motion
                p.x += p.vx * (1 + intensityRatio * 1.5);
                p.y += p.vy * (1 + intensityRatio * 1.5);

                // Boundary bounce
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < canvas.height * 0.3 || p.y > canvas.height) p.vy *= -1;

                // Burn dross handling
                if(p.burned && !p.isGold) {
                    if(p.alpha > 0) p.alpha -= 0.02; // Fade out dross
                } else {
                    if(p.alpha < 1) p.alpha += 0.05;
                }

                // Shine Gold if temperature is high
                if(p.isGold) {
                    p.brightness += (Math.random() - 0.5) * 0.2;
                    p.brightness = Math.max(0.3, Math.min(1.0, p.brightness));
                    
                    const goldGlowSize = p.size * (1 + intensityRatio * 2.0);
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, goldGlowSize, 0, Math.PI * 2);
                    
                    // High temp = Brilliant Golden Glowing halo
                    ctx.fillStyle = `rgba(245, 158, 11, ${p.brightness * p.alpha})`;
                    ctx.fill();
                    
                    if(intensityRatio > 0.5) {
                        ctx.shadowColor = '#F59E0B';
                        ctx.shadowBlur = 10;
                    }
                } else {
                    // Regular dark dross (representing worldly impurities)
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(100, 116, 139, ${0.7 * p.alpha})`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // Draw refinery pot structure
            ctx.strokeStyle = 'rgba(255,255,255,0.07)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, canvas.height * 0.4);
            ctx.lineTo(canvas.width - 10, canvas.height * 0.4);
            ctx.stroke();

            // Label text over the refinery
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.font = '9px monospace';
            ctx.textAlign = 'center';
            ctx.fillText("CRUCIBLE OF FAITH / 信心之冶炼炉", canvas.width / 2, canvas.height * 0.25);

            animationFrameId = requestAnimationFrame(runRefineryLoop);
        }
